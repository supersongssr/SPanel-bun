<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会员管理 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="usersPage()">
  
  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/85 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <span class="font-outfit text-2xl font-bold bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">SPanel</span>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-purple-500/10 text-purple-400 font-semibold border border-purple-500/20">Admin</span>
        </div>
        <div class="flex items-center space-x-6 text-sm">
          <a href="/admin/dashboard.html" class="text-slate-400 hover:text-purple-400 transition font-medium"><i class="fa-solid fa-chart-pie mr-1.5"></i>全局监控</a>
          <a href="/admin/users.html" class="text-purple-400 hover:text-purple-300 transition font-medium"><i class="fa-solid fa-user-gear mr-1.5"></i>会员管理</a>
          <a href="/admin/nodes.html" class="text-slate-400 hover:text-purple-400 transition font-medium"><i class="fa-solid fa-server mr-1.5"></i>节点调度</a>
          <button @click="logout" class="text-rose-400 hover:text-rose-300 transition font-medium"><i class="fa-solid fa-right-from-bracket mr-1.5"></i>退出</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 space-y-4 md:space-y-0">
      <div>
        <h2 class="text-2xl font-semibold font-outfit text-white">用户注册明细与配置修改</h2>
        <p class="text-slate-400 text-sm mt-2">在这里，您可以全面检索修改用户的等级授权、剩余流量配额、修改登录密码，或启用高安全性的管理员会话伪装调试模式。</p>
      </div>
      
      <!-- 搜索栏 -->
      <div class="relative w-full md:w-80">
        <input type="text" x-model="searchQuery" @input.debounce.300ms="fetchUsers" placeholder="搜索用户名或电子邮箱..." class="w-full bg-slate-900 border border-slate-800 rounded-xl py-3 pl-4 pr-10 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-purple-500 transition">
        <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500"><i class="fa-solid fa-magnifying-glass text-xs"></i></span>
      </div>
    </div>

    <!-- 用户数据列表卡片 -->
    <div class="glass-card rounded-2xl overflow-hidden border border-slate-800/80">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-900 text-slate-400 border-b border-slate-800 font-semibold uppercase tracking-wider text-[10px]">
              <th class="p-4">UID</th>
              <th class="p-4">用户名称</th>
              <th class="p-4">电子邮箱</th>
              <th class="p-4">端口</th>
              <th class="p-4">等级 (VIP)</th>
              <th class="p-4">账户余额</th>
              <th class="p-4">可用流量限制</th>
              <th class="p-4">启用状态</th>
              <th class="p-4 text-center">高阶管理操作</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800/50">
            <template x-for="user in users" :key="user.id">
              <tr class="hover:bg-slate-900/30 transition">
                <td class="p-4 font-outfit text-slate-500" x-text="user.id"></td>
                <td class="p-4 font-medium text-slate-200" x-text="user.user_name"></td>
                <td class="p-4 text-slate-400 font-mono" x-text="user.email"></td>
                <td class="p-4 font-outfit text-indigo-400" x-text="user.port"></td>
                <td class="p-4">
                  <span class="px-2 py-0.5 rounded bg-purple-500/10 text-purple-400 border border-purple-500/20 font-semibold font-outfit" x-text="'VIP ' + user.class"></span>
                </td>
                <td class="p-4 font-outfit text-emerald-400" x-text="'￥' + user.money"></td>
                <td class="p-4 font-outfit text-slate-400" x-text="formatBytes(BigInt(user.transfer_enable))"></td>
                <td class="p-4">
                  <span class="inline-flex items-center text-[10px]" :class="user.enable ? 'text-emerald-400' : 'text-rose-400'">
                    <i class="fa-solid fa-circle text-[6px] mr-1.5 animate-pulse"></i>
                    <span x-text="user.enable ? '正常' : '封禁'"></span>
                  </span>
                </td>
                <td class="p-4 flex items-center justify-center space-x-2">
                  <button @click="openEditModal(user)" class="bg-slate-900 border border-slate-800 hover:border-purple-500/50 text-slate-300 p-2 rounded-xl text-xs transition" title="编辑账户配置">
                    <i class="fa-regular fa-pen-to-square"></i>
                  </button>
                  <button @click="triggerMasquerade(user)" class="bg-slate-900 border border-slate-800 hover:border-indigo-500/50 text-indigo-400 p-2 rounded-xl text-xs transition" title="伪装登录调试">
                    <i class="fa-solid fa-user-ninja"></i>
                  </button>
                  <button @click="deleteUser(user.id)" class="bg-slate-950 border border-slate-800 hover:border-rose-500/30 text-rose-400 p-2 rounded-xl text-xs transition" title="删除账户">
                    <i class="fa-regular fa-trash-can"></i>
                  </button>
                </td>
              </tr>
            </template>
            <template x-if="users.length === 0">
              <tr>
                <td colspan="9" class="text-center py-8 text-slate-500 text-xs">没有找到符合筛选条件的用户记录。</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 用户参数编辑模态弹窗 -->
    <div class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-50 overflow-y-auto" x-show="showEditModal" x-transition>
      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-xl w-full mx-4 my-8 relative overflow-hidden" @click.away="closeEditModal">
        <h3 class="text-xl font-semibold text-white mb-6 flex items-center"><i class="fa-solid fa-user-pen text-purple-400 mr-2"></i>修改用户配置档案</h3>

        <form @submit.prevent="saveUserChanges" class="space-y-4 max-h-[450px] overflow-y-auto pr-2">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-400 text-xs mb-2">用户名</label>
              <input type="text" required x-model="editingUser.user_name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
            <div>
              <label class="block text-slate-400 text-xs mb-2">电子邮件 (可变更登录账号)</label>
              <input type="email" required x-model="editingUser.email" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-400 text-xs mb-2">重设登录密码 (留空则不更改)</label>
              <input type="password" x-model="editingUser.password" placeholder="重构新密码哈希" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
            <div>
              <label class="block text-slate-400 text-xs mb-2">Shadowsocks 密码</label>
              <input type="text" required x-model="editingUser.passwd" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-400 text-xs mb-2">可用金额余额 (元)</label>
              <input type="text" required x-model="editingUser.money" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
            <div>
              <label class="block text-slate-400 text-xs mb-2">总可用授权流量上限 (字节 Bytes)</label>
              <input type="text" required x-model="editingUser.transfer_enable" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-400 text-xs mb-2">会员等级 (Class)</label>
              <input type="number" required x-model.number="editingUser.class" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
            <div>
              <label class="block text-slate-400 text-xs mb-2">等级过期时间</label>
              <input type="text" required x-model="editingUser.class_expire" placeholder="格式 YYYY-MM-DD HH:MM:SS" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-400 text-xs mb-2">分流节点分组 (Group ID)</label>
              <input type="number" required x-model.number="editingUser.node_group" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
            <div class="flex items-center space-x-6 pt-6">
              <label class="flex items-center space-x-2 text-xs cursor-pointer text-slate-300">
                <input type="checkbox" x-model="editingUser.enable" class="bg-slate-950 border-slate-800 text-purple-500 rounded focus:ring-purple-500">
                <span>正常可用</span>
              </label>
              <label class="flex items-center space-x-2 text-xs cursor-pointer text-slate-300">
                <input type="checkbox" x-model="editingUser.is_admin" class="bg-slate-950 border-slate-800 text-purple-500 rounded focus:ring-purple-500">
                <span>系统管理员</span>
              </label>
            </div>
          </div>

          <div class="mt-8 flex space-x-3 pt-4 border-t border-slate-800">
            <button type="button" @click="closeEditModal" class="flex-1 bg-slate-950 border border-slate-800 hover:border-rose-500/30 text-slate-400 rounded-xl py-3 text-xs transition">
              关闭放弃
            </button>
            <button type="submit" :disabled="editLoading" class="flex-1 bg-gradient-to-r from-purple-500 via-indigo-500 to-pink-500 text-white rounded-xl py-3 text-xs font-semibold hover:brightness-110 transition disabled:opacity-50">
              <span x-show="!editLoading">保存修改记录</span>
              <span x-show="editLoading"><i class="fa-solid fa-spinner animate-spin mr-1"></i>保存中...</span>
            </button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function usersPage() {
      return {
        users: [],
        searchQuery: '',
        showEditModal: false,
        editingUser: {},
        editLoading: false,

        async init() {
          await this.fetchUsers();
        },

        async fetchUsers() {
          try {
            const url = this.searchQuery.trim() !== '' ? `/admin/user?search=${encodeURIComponent(this.searchQuery)}` : '/admin/user';
            const res = await SPanelAPI.request(url);
            this.users = res.data || [];
          } catch (err) {
            console.error('加载会员列表失败:', err.message);
          }
        },

        openEditModal(user) {
          // 深拷贝隔离
          this.editingUser = {
            ...user,
            password: ''
          };
          this.showEditModal = true;
        },

        closeEditModal() {
          this.showEditModal = false;
          this.editingUser = {};
        },

        async saveUserChanges() {
          this.editLoading = true;
          try {
            await SPanelAPI.request(`/admin/user/${this.editingUser.id}`, {
              method: 'PUT',
              body: JSON.stringify({
                user_name: this.editingUser.user_name,
                email: this.editingUser.email,
                password: this.editingUser.password || undefined,
                passwd: this.editingUser.passwd,
                money: this.editingUser.money,
                transfer_enable: this.editingUser.transfer_enable,
                class: this.editingUser.class,
                class_expire: this.editingUser.class_expire,
                enable: this.editingUser.enable,
                node_group: this.editingUser.node_group,
                is_admin: this.editingUser.is_admin
              })
            });

            alert('用户账目配置更新成功！');
            this.closeEditModal();
            await this.fetchUsers();
          } catch (err) {
            alert(err.message || '更新用户信息失败，请校验输入格式。');
          } finally {
            this.editLoading = false;
          }
        },

        async triggerMasquerade(user) {
          const confirmOk = confirm(`您确认要以 [${user.user_name}] 的身份伪装登入其会员中心进行调试吗？这将建立一个具有完整访问权的隔离调试会话。`);
          if (!confirmOk) return;

          try {
            const res = await SPanelAPI.request(`/admin/user/${user.id}/masquerade`, { method: 'POST' });
            const token = res.data.token;
            
            // 为保护现有管理员身份，我们将伪装身份存储至独立的 LocalStorage 键中，或在此窗口临时重写并重定向，新开窗口
            const masqueradeWindow = window.open('/user/dashboard.html', '_blank');
            
            // 写入会话缓存至目标窗口中
            if (masqueradeWindow) {
              masqueradeWindow.onload = function () {
                masqueradeWindow.localStorage.setItem('spanel_jwt', token);
                masqueradeWindow.localStorage.setItem('spanel_user', JSON.stringify({
                  id: user.id,
                  email: user.email,
                  isAdmin: false
                }));
                // 重载目标窗口以触发 auth-guard 验证
                masqueradeWindow.location.reload();
              };
            } else {
              alert('新弹窗被拦截，请允许本站弹出窗口。');
            }
          } catch (err) {
            alert('获取伪装令牌失败: ' + err.message);
          }
        },

        async deleteUser(userId) {
          const confirmOk = confirm('危险操作：您确定要物理删除当前用户的账户吗？这会清除其所有购买包与配置流水，且数据无法找回！');
          if (!confirmOk) return;

          try {
            await SPanelAPI.request(`/admin/user/${userId}`, { method: 'DELETE' });
            alert('该用户账户已彻底物理清除。');
            await this.fetchUsers();
          } catch (err) {
            alert('删除账户失败: ' + err.message);
          }
        },

        formatBytes(bytes) {
          if (bytes === 0n) return '0 B';
          const k = 1024n;
          const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
          let i = 0;
          let temp = bytes;
          while (temp >= k && i < sizes.length - 1) {
            temp = temp / k;
            i++;
          }
          return temp.toString() + ' ' + sizes[i];
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
