<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统登录 - SPanel</title>
  <!-- M7.2: 防闪现拦截守卫 - 必须在 head 顶部同步执行 -->
  <script src="/assets/js/auth-guard.js"></script>
  <!-- CSS CDN / Tailwind & FontAwesome & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Alpine.js & Geetest v4 -->
  <script src="https://static.geetest.com/v4/gt4.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Tailwind Config for Premium Theme -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .neon-border::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 1.5rem;
      padding: 2px;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
</head>
<body class="h-full flex items-center justify-center bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black overflow-hidden relative">
  <!-- 背景艺术发光环 -->
  <div class="absolute w-96 h-96 rounded-full bg-indigo-600/10 blur-[120px] top-1/4 left-1/4 animate-pulse"></div>
  <div class="absolute w-96 h-96 rounded-full bg-purple-600/10 blur-[120px] bottom-1/4 right-1/4 animate-pulse delay-700"></div>

  <!-- 登录卡片区 -->
  <div x-data="loginForm()" class="w-full max-w-md p-0.5 relative z-10 mx-4">
    <div class="relative bg-slate-900/60 backdrop-blur-2xl p-8 rounded-[1.5rem] shadow-2xl neon-border border border-white/5">
      <div class="text-center mb-8">
        <h1 class="font-outfit text-4xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">SPanel</h1>
        <p class="text-slate-400 text-sm mt-2 font-light">安全连接 · 高能算力 CC 防御体系</p>
      </div>

      <!-- 表单输入 -->
      <form @submit.prevent="submitLogin" class="space-y-5">
        <!-- 邮箱 -->
        <div>
          <label class="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2">电子邮箱</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-regular fa-envelope"></i></span>
            <input type="email" required x-model="email" placeholder="name@domain.com" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-300">
          </div>
        </div>

        <!-- 密码 -->
        <div>
          <label class="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2">登录密码</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-lock"></i></span>
            <input type="password" required x-model="password" placeholder="••••••••" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-300">
          </div>
        </div>

        <!-- 图形验证码 (captchaProvider === 'graphic') -->
        <div x-show="captchaProvider === 'graphic'">
          <label class="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2">图形验证码</label>
          <div class="flex space-x-3">
            <div class="relative flex-1">
              <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-shield-halved"></i></span>
              <input type="text" :required="captchaProvider === 'graphic'" x-model="captchaCode" placeholder="验证码" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-300">
            </div>
            <!-- 验证码 SVG 卡片 -->
            <div @click="refreshCaptcha" class="bg-slate-950 border border-slate-800 rounded-xl overflow-hidden cursor-pointer h-12 w-28 flex items-center justify-center transition hover:border-indigo-500" x-html="captchaSvg" title="点击刷新">
              <span class="text-slate-600 text-xs animate-pulse">加载中...</span>
            </div>
          </div>
        </div>

        <!-- 极验验证码 (captchaProvider === 'geetest') -->
        <div x-show="captchaProvider === 'geetest'" class="space-y-2">
          <label class="block text-slate-300 text-xs font-semibold uppercase tracking-wider mb-2">人机安全校验</label>
          <div id="geetest-captcha" class="w-full min-h-12 flex items-center justify-center bg-slate-950/80 border border-slate-800 rounded-xl overflow-hidden py-1">
            <span class="text-slate-500 text-xs animate-pulse">正在载入极验安全组件...</span>
          </div>
        </div>

        <!-- 提交按钮与状态展示 -->
        <div class="pt-2">
          <button type="submit" :disabled="loading" class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white rounded-xl py-3.5 px-4 text-sm font-semibold tracking-wide shadow-lg shadow-indigo-500/20 hover:shadow-indigo-500/35 hover:brightness-110 active:scale-[0.98] transition duration-300 flex items-center justify-center disabled:opacity-50 disabled:pointer-events-none">
            <template x-if="!loading">
              <span>立即登入</span>
            </template>
            <template x-if="loading">
              <div class="flex items-center space-x-2">
                <i class="fa-solid fa-spinner animate-spin"></i>
                <span x-text="statusText">正在验证算力...</span>
              </div>
            </template>
          </button>
        </div>
      </form>

      <!-- 友情跳转 -->
      <div class="mt-8 text-center text-xs text-slate-500 font-light flex items-center justify-between">
        <a href="/auth/reset.html" class="hover:text-indigo-400 transition">忘记密码？</a>
        <span>还没有账户？<a href="/auth/register.html" class="text-indigo-400 font-semibold hover:text-indigo-300 transition">立即注册</a></span>
      </div>
    </div>
  </div>

  <!-- API Communication Core -->
  <script src="/assets/js/api.js"></script>
  <script>
    function loginForm() {
      return {
        email: '',
        password: '',
        captchaCode: '',
        captchaId: '',
        captchaSvg: '',
        captchaProvider: 'graphic',
        geetestId: '',
        geetestValidate: null,
        geetestCaptchaObj: null,
        loading: false,
        statusText: '正在提交...',

        async init() {
          await this.loadCaptcha();
        },

        async loadCaptcha() {
          try {
            const res = await SPanelAPI.request('/auth/captcha', { method: 'GET' });
            this.captchaProvider = res.captcha_provider || 'graphic';
            if (this.captchaProvider === 'geetest') {
              this.geetestId = res.geetest_id;
              this.$nextTick(() => {
                this.initGeetest();
              });
            } else {
              this.captchaId = res.captchaId;
              this.captchaSvg = res.svg;
              this.captchaCode = '';
            }
          } catch (err) {
            console.error('拉取验证码配置失败:', err);
          }
        },

        initGeetest() {
          if (window.initGeetest4) {
            window.initGeetest4({
              captchaId: this.geetestId,
              product: 'float',
              onError: (err) => {
                console.error('[Geetest] config.onError:', err);
              }
            }, (captchaObj) => {
              const container = document.getElementById('geetest-captcha');
              if (container) container.innerHTML = '';
              captchaObj.appendTo('#geetest-captcha');
              captchaObj.onSuccess(() => {
                this.geetestValidate = captchaObj.getValidate();
              });
              this.geetestCaptchaObj = captchaObj;
            });
          } else {
            console.error('[Geetest] initGeetest4 is not defined');
          }
        },

        async refreshCaptcha() {
          if (this.captchaProvider === 'geetest') {
            if (this.geetestCaptchaObj) {
              this.geetestCaptchaObj.reset();
            }
            this.geetestValidate = null;
          } else {
            try {
              const res = await SPanelAPI.request('/auth/captcha', { method: 'GET' });
              this.captchaId = res.captchaId;
              this.captchaSvg = res.svg;
              this.captchaCode = '';
            } catch (err) {
              alert('图形验证码拉取失败，请检查网络。');
            }
          }
        },

        async submitLogin() {
          if (this.captchaProvider === 'geetest' && !this.geetestValidate) {
            alert('请先完成极验滑动验证。');
            return;
          }

          this.loading = true;
          this.statusText = '正在校验验证码并下发算力盐...';

          try {
            this.statusText = '正在加速计算 POW 算力防CC挑战...';
            
            let powResult;
            if (this.captchaProvider === 'geetest') {
              powResult = await SPanelAPI.getPowChallengeAndSolve({
                geetestParams: this.geetestValidate
              });
            } else {
              powResult = await SPanelAPI.getPowChallengeAndSolve(this.captchaId, this.captchaCode);
            }

            this.statusText = '算力校验成功，正在验证账户密码...';
            const loginResult = await SPanelAPI.request('/auth/login', {
              method: 'POST',
              body: JSON.stringify({
                email: this.email,
                password: this.password,
                powSalt: powResult.powSalt,
                powNonce: powResult.powNonce,
              })
            });

            localStorage.setItem('spanel_jwt', loginResult.data.token);
            localStorage.setItem('spanel_user', JSON.stringify(loginResult.data.user));

            this.statusText = '登录验证成功，正在进入工作台...';
            setTimeout(() => {
              if (loginResult.data.user.isAdmin === 1) {
                window.location.replace('/admin/dashboard.html');
              } else {
                window.location.replace('/user/dashboard.html');
              }
            }, 500);

          } catch (err) {
            alert(err.message || '登录异常，请重试。');
            this.refreshCaptcha();
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>
</html>
