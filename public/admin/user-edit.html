<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑会员账户 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="adminUserEditPage()">
  
  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/85 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <a href="/admin/dashboard.html" class="font-outfit text-2xl font-bold bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">SPanel</a>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-purple-500/10 text-purple-400 font-semibold border border-purple-500/20">Admin</span>
        </div>
        <div class="flex items-center space-x-5 text-sm overflow-x-auto py-2 custom-scrollbar">
          <a href="/admin/dashboard.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-chart-pie mr-1.5"></i>监控</a>
          <a href="/admin/users.html" class="text-purple-400 hover:text-purple-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-user-gear mr-1.5"></i>会员</a>
          <a href="/admin/nodes.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-server mr-1.5"></i>节点</a>
          <a href="/admin/shops.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-bag-shopping mr-1.5"></i>商品</a>
          <a href="/admin/tickets.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-envelope-open-text mr-1.5"></i>工单</a>
          <a href="/admin/announcements.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-bullhorn mr-1.5"></i>公告</a>
          <a href="/admin/coupons.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-ticket mr-1.5"></i>优惠券</a>
          <a href="/admin/codes.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-barcode mr-1.5"></i>卡密</a>
          <a href="/admin/invites.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-users mr-1.5"></i>推广</a>
          <a href="/admin/audits.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-shield-halved mr-1.5"></i>审计</a>
          <a href="/admin/settings.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-gears mr-1.5"></i>设置</a>
          <button @click="logout" class="text-rose-400 hover:text-rose-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-right-from-bracket mr-1.5"></i>退出</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    <div class="mb-8 flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-semibold font-outfit text-white" x-text="'编辑会员: ' + form.user_name">修改会员配置</h2>
        <p class="text-slate-400 text-sm mt-1">更新会员名、等级状态、可用流量限制或直接修改其登录密码。</p>
      </div>
      <a href="/admin/users.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-750 px-4 py-2 rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-chevron-left mr-1.5"></i>返回会员列表</a>
    </div>

    <!-- 表单卡片 -->
    <div class="glass-card rounded-3xl p-8 border border-slate-800/80">
      <form @submit.prevent="submitForm" class="space-y-6">
        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">用户名</label>
            <input type="text" required x-model="form.user_name" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">登录邮箱地址 (Email)</label>
            <input type="email" required x-model="form.email" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition font-mono">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">修改登录密码 (留空代表不修改原密码)</label>
            <input type="password" x-model="form.password" placeholder="仅在需要重设密码时填写" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Shadowsocks 物理连接密码 (passwd)</label>
            <input type="text" required x-model="form.passwd" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition font-mono">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">钱包余额 (元)</label>
            <input type="text" required x-model="form.money" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition font-mono">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">总计可用流量限制数 (Bytes)</label>
            <input type="text" required x-model="form.transfer_enable" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition font-mono">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-6">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">账户会员等级 (class)</label>
            <input type="number" required x-model.number="form.class" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">账户等级到期截止时间</label>
            <input type="datetime-local" required x-model="form.class_expire" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition font-mono">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">隔离调度分配分组 (Group ID)</label>
            <input type="number" required x-model.number="form.node_group" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-6 pt-2">
          <label class="flex items-center space-x-3 cursor-pointer">
            <input type="checkbox" x-model="form.enable" class="rounded border-slate-800 text-purple-600 bg-slate-900 focus:ring-purple-500">
            <span class="text-xs text-slate-300 select-none font-semibold">账户状态启用 (勾选可用，未勾选将被断开连接且无法登录)</span>
          </label>
          <label class="flex items-center space-x-3 cursor-pointer">
            <input type="checkbox" x-model="form.is_admin" class="rounded border-slate-800 text-purple-600 bg-slate-900 focus:ring-purple-500">
            <span class="text-xs text-slate-300 select-none font-semibold">超级管理员特权身份</span>
          </label>
        </div>

        <div class="pt-6 border-t border-slate-800 flex justify-end space-x-4">
          <a href="/admin/users.html" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-850 px-6 py-3 rounded-xl text-xs font-semibold transition">取消</a>
          <button type="submit" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white px-6 py-3 rounded-xl text-xs font-semibold transition shadow-lg shadow-purple-600/20">保存账户修改</button>
        </div>
      </form>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function adminUserEditPage() {
      return {
        userId: null,
        form: {
          user_name: '',
          email: '',
          password: '',
          passwd: '',
          money: '',
          transfer_enable: '',
          class: 0,
          class_expire: '',
          node_group: 0,
          enable: true,
          is_admin: false
        },

        async init() {
          const urlParams = new URLSearchParams(window.location.search);
          const id = urlParams.get('id');
          if (!id) {
            alert('缺少用户 ID，无法进行编辑！');
            window.location.replace('/admin/users.html');
            return;
          }
          this.userId = id;
          await this.fetchUserDetails();
        },

        async fetchUserDetails() {
          try {
            const res = await SPanelAPI.request(`/admin/user/${this.userId}`);
            this.form = {
              ...res.data,
              password: '' // 密码默认为空
            };
          } catch (err) {
            alert('读取会员信息失败: ' + err.message);
            window.location.replace('/admin/users.html');
          }
        },

        async submitForm() {
          try {
            // 对齐后台时间格式，将 datetime-local 转换为标准 ISO String 或 date parseable format
            const expireDate = new Date(this.form.class_expire);
            if (isNaN(expireDate.getTime())) {
              alert('请输入合法的等级过期时间！');
              return;
            }

            const bodyPayload = {
              ...this.form,
              class_expire: expireDate.toISOString()
            };

            await SPanelAPI.request(`/admin/user/${this.userId}`, {
              method: 'PUT',
              body: JSON.stringify(bodyPayload)
            });
            alert('会员账户资料修改保存成功！');
            window.location.replace('/admin/users.html');
          } catch (err) {
            alert('更新会员配置失败: ' + err.message);
          }
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
