<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工单详情 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="viewTicketPage()">
  
  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <span class="font-outfit text-2xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">SPanel</span>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-semibold border border-indigo-500/20">Member</span>
        </div>
        <div class="flex items-center space-x-6 text-sm overflow-x-auto scrollbar-none">
          <a href="/user/dashboard.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-chart-line mr-1.5"></i>控制台</a>
          <a href="/user/nodes.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-server mr-1.5"></i>节点列表</a>
          <a href="/user/relay.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-route mr-1.5"></i>中转规则</a>
          <a href="/user/shop.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-store mr-1.5"></i>套餐商店</a>
          <a href="/user/code.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-credit-card mr-1.5"></i>卡密充值</a>
          <a href="/user/invite.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-gift mr-1.5"></i>推广联盟</a>
          <a href="/user/tickets.html" class="text-indigo-400 hover:text-indigo-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-ticket mr-1.5"></i>工单支持</a>
          
          <!-- 用户下拉子菜单 -->
          <div class="relative" x-data="{ open: false }" @click.away="open = false">
            <button @click="open = !open" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap focus:outline-none flex items-center">
              <i class="fa-solid fa-user-gear mr-1.5"></i>我的账户<i class="fa-solid fa-chevron-down text-[10px] ml-1 transition" :class="open ? 'rotate-180' : ''"></i>
            </button>
            <div class="absolute right-0 mt-2 w-40 rounded-xl bg-slate-900 border border-slate-800 shadow-xl py-1 z-50" x-show="open" x-transition>
              <a href="/user/profile.html" class="block px-4 py-2 text-xs text-slate-300 hover:bg-slate-800 transition"><i class="fa-solid fa-user mr-2"></i>个人中心</a>
              <a href="/user/edit.html" class="block px-4 py-2 text-xs text-slate-300 hover:bg-slate-800 transition"><i class="fa-solid fa-shield-halved mr-2"></i>安全设置</a>
              <hr class="border-slate-800 my-1">
              <button @click="logout" class="w-full text-left px-4 py-2 text-xs text-rose-400 hover:bg-rose-950/20 transition"><i class="fa-solid fa-right-from-bracket mr-2"></i>退出登录</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    <div class="mb-8">
      <a href="/user/tickets.html" class="text-xs text-indigo-400 hover:text-indigo-300 transition font-medium"><i class="fa-solid fa-arrow-left-long mr-1.5"></i>返回工单支持中心</a>
      
      <!-- 工单状态横条 -->
      <div class="mt-4 flex flex-col sm:flex-row justify-between items-start sm:items-center p-6 glass-card rounded-2xl">
        <div>
          <span class="text-[10px] text-slate-500 uppercase font-semibold block" x-text="'工单编码 #' + ticketId"></span>
          <h2 class="text-xl font-semibold text-white mt-1" x-text="ticket.title || '加载工单中...'"></h2>
        </div>
        <div class="mt-3 sm:mt-0 flex items-center space-x-3">
          <span class="text-xs px-3 py-1 rounded-full font-bold uppercase border"
                :class="ticket.status === 'open' ? 'text-indigo-400 bg-indigo-500/10 border-indigo-500/20' : 'text-slate-500 bg-slate-900 border-slate-800'"
                x-text="ticket.status === 'open' ? '受理处理中' : '工单已结单'"></span>
        </div>
      </div>
    </div>

    <!-- 追问会话框 -->
    <div class="glass-card rounded-2xl overflow-hidden flex flex-col justify-between min-h-[450px]">
      
      <!-- 对话列表滚动区 -->
      <div class="flex-1 overflow-y-auto p-6 space-y-6 max-h-[500px]">
        <template x-for="chat in ticket.chat_flow" :key="chat.id">
          <div class="flex flex-col" :class="chat.role === 'user' ? 'items-end' : 'items-start'">
            <div class="flex items-center space-x-2 text-[10px] text-slate-500 mb-1.5">
              <span class="font-semibold" x-text="chat.role === 'user' ? '我 (发件人)' : '系统官方网络专员'"></span>
              <span x-text="chat.datetime"></span>
            </div>
            <!-- 对话气泡 -->
            <div class="p-4 rounded-2xl text-xs max-w-xl leading-relaxed whitespace-pre-wrap font-mono"
                 :class="chat.role === 'user' ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-slate-950 text-slate-200 border border-slate-800/80 rounded-tl-none'"
                 x-text="chat.content"></div>
          </div>
        </template>

        <template x-if="!ticket.chat_flow || ticket.chat_flow.length === 0">
          <div class="text-center py-12 text-slate-600 text-xs"><i class="fa-solid fa-spinner animate-spin mr-2"></i>正在加载工单对话流水...</div>
        </template>
      </div>

      <!-- 回复输入区 -->
      <div class="border-t border-slate-800/80 p-6 bg-slate-950/20">
        <template x-if="ticket.status === 'open'">
          <div class="space-y-4">
            <textarea x-model="replyContent" rows="3" placeholder="在此输入追加追问的具体信息..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 transition leading-relaxed"></textarea>
            
            <div class="flex justify-end space-x-3">
              <button @click="sendReply" :disabled="replyLoading" class="bg-indigo-500 hover:bg-indigo-600 text-white px-6 py-2.5 rounded-xl text-xs font-semibold transition disabled:opacity-50 flex items-center justify-center">
                <span x-show="!replyLoading"><i class="fa-solid fa-reply mr-1.5"></i>发送追加追问</span>
                <span x-show="replyLoading"><i class="fa-solid fa-spinner animate-spin"></i> 发送中...</span>
              </button>
            </div>
          </div>
        </template>
        
        <template x-if="ticket.status !== 'open'">
          <div class="text-center py-4 text-xs text-slate-500 bg-slate-950/40 border border-slate-900 rounded-xl leading-relaxed">
            <i class="fa-solid fa-lock mr-2 text-indigo-400"></i>本工单已被客服专员操作结单，会话流已安全锁定。如有其他技术/财务问题，请<a href="/user/ticket-create.html" class="text-indigo-400 hover:text-indigo-300 font-semibold underline mx-1">提交新工单</a>。
          </div>
        </template>
      </div>

    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function viewTicketPage() {
      return {
        ticketId: '',
        ticket: {},
        replyContent: '',
        replyLoading: false,

        async init() {
          const urlParams = new URLSearchParams(window.location.search);
          this.ticketId = urlParams.get('id');
          if (!this.ticketId) {
            alert('工单 ID 缺失！');
            window.location.replace('/user/tickets.html');
            return;
          }
          await this.fetchTicketDetails();
        },

        async fetchTicketDetails() {
          try {
            const res = await SPanelAPI.request(`/user/ticket/${this.ticketId}`);
            this.ticket = res.data;
          } catch(err) {
            alert('获取工单明细错误：' + err.message);
            window.location.replace('/user/tickets.html');
          }
        },

        async sendReply() {
          if (!this.replyContent.trim()) {
            alert('请输入追加回复内容！');
            return;
          }
          this.replyLoading = true;
          try {
            const res = await SPanelAPI.request(`/user/ticket/${this.ticketId}`, {
              method: 'PUT',
              body: JSON.stringify({ content: this.replyContent.trim() })
            });
            alert(res.message || '回复成功！');
            this.replyContent = '';
            await this.fetchTicketDetails();
          } catch(err) {
            alert(err.message || '回复失败，请稍后再试。');
          } finally {
            this.replyLoading = false;
          }
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
