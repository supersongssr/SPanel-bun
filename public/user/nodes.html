<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>节点列表 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="nodesPage()">
  
  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <a href="/user/dashboard.html" class="font-outfit text-2xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">SPanel</a>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-semibold border border-indigo-500/20">Member</span>
        </div>
        <div class="flex items-center space-x-6 text-sm overflow-x-auto scrollbar-none">
          <a href="/user/dashboard.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-chart-line mr-1.5"></i>控制台</a>
          <a href="/user/nodes.html" class="text-indigo-400 hover:text-indigo-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-server mr-1.5"></i>节点列表</a>
          <a href="/user/relay.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-route mr-1.5"></i>中转规则</a>
          <a href="/user/shop.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-store mr-1.5"></i>套餐商店</a>
          <a href="/user/code.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-credit-card mr-1.5"></i>卡密充值</a>
          <a href="/user/invite.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-gift mr-1.5"></i>推广联盟</a>
          <a href="/user/tickets.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-ticket mr-1.5"></i>工单支持</a>
          
          <!-- 用户下拉子菜单 -->
          <div class="relative" x-data="{ open: false }" @click.away="open = false">
            <button @click="open = !open" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap focus:outline-none flex items-center">
              <i class="fa-solid fa-user-gear mr-1.5"></i>我的账户<i class="fa-solid fa-chevron-down text-[10px] ml-1 transition" :class="open ? 'rotate-180' : ''"></i>
            </button>
            <div class="absolute right-0 mt-2 w-40 rounded-xl bg-slate-900 border border-slate-800 shadow-xl py-1 z-50" x-show="open" x-transition>
              <a href="/user/profile.html" class="block px-4 py-2 text-xs text-slate-300 hover:bg-slate-800 transition"><i class="fa-solid fa-user mr-2"></i>个人中心</a>
              <a href="/user/edit.html" class="block px-4 py-2 text-xs text-slate-300 hover:bg-slate-800 transition"><i class="fa-solid fa-shield-halved mr-2"></i>安全设置</a>
              <hr class="border-slate-800 my-1">
              <button @click="logout" class="w-full text-left px-4 py-2 text-xs text-rose-400 hover:bg-rose-950/20 transition"><i class="fa-solid fa-right-from-bracket mr-2"></i>退出登录</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    <div class="mb-8">
      <h2 class="text-2xl font-semibold font-outfit text-white">全球加速代理物理节点</h2>
      <p class="text-slate-400 text-sm mt-2">在这里，您可以实时监控每个加速服务器的状态和负载。点击卡片以测试实时网络延迟和运行详情。</p>
    </div>

    <!-- 节点列表格网 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <template x-for="node in nodes" :key="node.id">
        <div class="glass-card rounded-2xl p-6 relative overflow-hidden transition hover:scale-[1.02] hover:border-slate-700/50 cursor-pointer" @click="fetchNodeDetails(node.id)">
          <!-- 国家代码角标 -->
          <div class="absolute right-4 top-4 flex items-center space-x-2">
            <span class="text-xs px-2.5 py-0.5 rounded-full font-semibold font-outfit uppercase border bg-slate-900 border-slate-800"
                  :class="node.online ? 'text-indigo-400 border-indigo-500/20' : 'text-slate-500 border-slate-800/80'"
                  x-text="node.country_code"></span>
          </div>

          <div class="flex items-start space-x-4">
            <div class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-indigo-400">
              <i class="fa-solid fa-wifi text-sm"></i>
            </div>
            <div>
              <h4 class="font-semibold text-white text-base" x-text="node.name"></h4>
              <p class="text-[10px] text-slate-500 mt-1" x-text="node.info"></p>
            </div>
          </div>

          <!-- 费率与速度等级 -->
          <div class="mt-6 pt-4 border-t border-slate-800/50 flex items-center justify-between text-xs text-slate-400">
            <div>
              <span class="text-slate-500">费率比例: </span>
              <span class="font-outfit text-indigo-400 font-bold" x-text="node.traffic_rate + 'x'"></span>
            </div>
            <div>
              <span class="text-slate-500">速度上限: </span>
              <span class="font-outfit text-indigo-400 font-bold" x-text="node.node_speedlimit === '0.00' ? '无限制' : node.node_speedlimit + ' Mbps'"></span>
            </div>
          </div>

          <!-- 展开详情 (动态拉取) -->
          <div class="mt-4 bg-slate-950/80 p-3 rounded-xl border border-slate-800/50 space-y-2 text-[10px]" x-show="nodeDetails[node.id]">
            <div class="flex justify-between text-slate-500">
              <span>系统运行时间 (Uptime): </span>
              <span class="text-slate-300 font-semibold" x-text="nodeDetails[node.id]?.uptime_str || '读取中...'"></span>
            </div>
            <div class="flex justify-between text-slate-500">
              <span>物理负载 (CPU/Load): </span>
              <span class="text-slate-300 font-semibold font-outfit" x-text="nodeDetails[node.id]?.load || '读取中...'"></span>
            </div>
            <div class="flex justify-between text-slate-500">
              <span>当前在线人数: </span>
              <span class="text-indigo-400 font-bold font-outfit" x-text="nodeDetails[node.id]?.online_users + ' 人'"></span>
            </div>
          </div>

          <div class="mt-4 flex items-center justify-between">
            <span class="text-[10px] flex items-center" :class="node.online ? 'text-emerald-400' : 'text-slate-500'">
              <i class="fa-solid fa-circle text-[6px] mr-1.5 animate-pulse"></i>
              <span x-text="node.online ? '健康在线' : '离线维护'"></span>
            </span>
            <span class="text-[10px] text-slate-500" x-show="!nodeDetails[node.id]">点击测速并获取详情 <i class="fa-solid fa-chevron-down ml-0.5"></i></span>
          </div>
        </div>
      </template>

      <template x-if="nodes.length === 0">
        <div class="col-span-full text-center py-12 text-slate-500 text-xs">暂无可用的物理代理服务器节点。</div>
      </template>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function nodesPage() {
      return {
        nodes: [],
        nodeDetails: {},

        async init() {
          await this.fetchNodes();
        },

        async fetchNodes() {
          try {
            const res = await SPanelAPI.request('/user/node');
            this.nodes = res.data || [];
          } catch (err) {
            console.error(err.message);
          }
        },

        async fetchNodeDetails(nodeId) {
          if (this.nodeDetails[nodeId]) {
            // 重复点击则折叠
            delete this.nodeDetails[nodeId];
            return;
          }

          // 占位
          this.nodeDetails[nodeId] = { uptime_str: '正在测速...', load: '计算中...', online_users: 0 };
          
          try {
            const res = await SPanelAPI.request(`/user/node/${nodeId}/ajax`);
            const details = res.data;
            
            // 格式化 uptime 秒数
            const seconds = details.uptime;
            const days = Math.floor(seconds / (24 * 3600));
            const hours = Math.floor((seconds % (24 * 3600)) / 3600);
            const uptimeStr = days > 0 ? `${days}天 ${hours}小时` : `${hours}小时`;

            this.nodeDetails[nodeId] = {
              uptime_str: uptimeStr,
              load: details.load,
              online_users: details.online_users
            };
          } catch (err) {
            this.nodeDetails[nodeId] = { uptime_str: '测速失败', load: '离线', online_users: 0 };
          }
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
