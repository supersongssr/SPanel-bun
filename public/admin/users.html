<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会员管理 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="adminUsersPage()">
  
  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/85 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <a href="/admin/dashboard.html" class="font-outfit text-2xl font-bold bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">SPanel</a>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-purple-500/10 text-purple-400 font-semibold border border-purple-500/20">Admin</span>
        </div>
        <div class="flex items-center space-x-5 text-sm overflow-x-auto py-2 custom-scrollbar">
          <a href="/admin/dashboard.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-chart-pie mr-1.5"></i>监控</a>
          <a href="/admin/users.html" class="text-purple-400 hover:text-purple-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-user-gear mr-1.5"></i>会员</a>
          <a href="/admin/nodes.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-server mr-1.5"></i>节点</a>
          <a href="/admin/shops.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-bag-shopping mr-1.5"></i>商品</a>
          <a href="/admin/tickets.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-envelope-open-text mr-1.5"></i>工单</a>
          <a href="/admin/announcements.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-bullhorn mr-1.5"></i>公告</a>
          <a href="/admin/coupons.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-ticket mr-1.5"></i>优惠券</a>
          <a href="/admin/codes.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-barcode mr-1.5"></i>卡密</a>
          <a href="/admin/invites.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-users mr-1.5"></i>推广</a>
          <a href="/admin/audits.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-shield-halved mr-1.5"></i>审计</a>
          <a href="/admin/settings.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-gears mr-1.5"></i>设置</a>
          <button @click="logout" class="text-rose-400 hover:text-rose-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-right-from-bracket mr-1.5"></i>退出</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 space-y-4 md:space-y-0">
      <div>
        <h2 class="text-2xl font-semibold font-outfit text-white">会员用户资产与等级管理</h2>
        <p class="text-slate-400 text-sm mt-2">全面检索修改用户的级别特权、钱包余额、可用流量限额或直接进行管理员身份伪装登录调试。</p>
      </div>
      
      <div class="flex items-center space-x-4">
        <!-- 搜索栏 -->
        <div class="relative w-64">
          <input type="text" x-model="searchQuery" @input.debounce.300ms="fetchUsers" placeholder="搜索用户名或电子邮箱..." class="w-full bg-slate-900 border border-slate-800 rounded-xl py-2.5 pl-4 pr-10 text-xs text-slate-100 placeholder-slate-650 focus:outline-none focus:border-purple-500 transition">
          <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500"><i class="fa-solid fa-magnifying-glass text-xs"></i></span>
        </div>
        <a href="/admin/user-create.html" class="bg-purple-500 hover:bg-purple-600 text-white px-5 py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-purple-500/20 transition flex items-center whitespace-nowrap">
          <i class="fa-solid fa-plus mr-2"></i>手动新增会员
        </a>
      </div>
    </div>

    <!-- 用户数据列表卡片 -->
    <div class="glass-card rounded-2xl overflow-hidden border border-slate-800/80">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-900 text-slate-400 border-b border-slate-800 font-semibold uppercase tracking-wider text-[10px]">
              <th class="p-4">UID</th>
              <th class="p-4">用户名称</th>
              <th class="p-4">电子邮箱</th>
              <th class="p-4">端口</th>
              <th class="p-4">等级 (VIP)</th>
              <th class="p-4">账户余额</th>
              <th class="p-4">可用流量限制</th>
              <th class="p-4">启用状态</th>
              <th class="p-4 text-center">高阶管理操作</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800/50">
            <template x-for="user in users" :key="user.id">
              <tr class="hover:bg-slate-900/30 transition">
                <td class="p-4 font-outfit text-slate-500" x-text="user.id"></td>
                <td class="p-4 font-medium text-slate-200" x-text="user.user_name"></td>
                <td class="p-4 text-slate-400 font-mono" x-text="user.email"></td>
                <td class="p-4 font-outfit text-indigo-400" x-text="user.port"></td>
                <td class="p-4">
                  <span class="px-2 py-0.5 rounded bg-purple-500/10 text-purple-400 border border-purple-500/20 font-semibold font-outfit" x-text="'VIP ' + user.class"></span>
                </td>
                <td class="p-4 font-outfit text-emerald-400" x-text="'￥' + user.money"></td>
                <td class="p-4 font-outfit text-slate-400" x-text="formatBytes(BigInt(user.transfer_enable))"></td>
                <td class="p-4">
                  <span class="inline-flex items-center text-[10px]" :class="user.enable ? 'text-emerald-400' : 'text-rose-400'">
                    <i class="fa-solid fa-circle text-[6px] mr-1.5 animate-pulse"></i>
                    <span x-text="user.enable ? '正常' : '封禁'"></span>
                  </span>
                </td>
                <td class="p-4 flex items-center justify-center space-x-2">
                  <a :href="'/admin/user-edit.html?id=' + user.id" class="bg-slate-900 border border-slate-800 hover:border-purple-500/50 text-slate-300 p-2 rounded-xl text-xs transition" title="编辑账户配置">
                    <i class="fa-regular fa-pen-to-square"></i>
                  </a>
                  <button @click="triggerMasquerade(user)" class="bg-slate-900 border border-slate-800 hover:border-indigo-500/50 text-indigo-400 p-2 rounded-xl text-xs transition" title="伪装登录调试">
                    <i class="fa-solid fa-user-ninja"></i>
                  </button>
                  <button @click="deleteUser(user.id)" class="bg-slate-950 border border-slate-800 hover:border-rose-500/30 text-rose-400 p-2 rounded-xl text-xs transition" title="删除账户">
                    <i class="fa-regular fa-trash-can"></i>
                  </button>
                </td>
              </tr>
            </template>
            <tr x-show="users.length === 0">
              <td colspan="9" class="text-center py-8 text-slate-500 text-xs">没有找到符合筛选条件的用户记录。</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function adminUsersPage() {
      return {
        users: [],
        searchQuery: '',

        async init() {
          await this.fetchUsers();
        },

        async fetchUsers() {
          try {
            const res = await SPanelAPI.request(`/admin/user?search=${this.searchQuery}`);
            this.users = res.data || [];
          } catch (err) {
            console.error('加载会员列表失败:', err.message);
          }
        },

        async triggerMasquerade(user) {
          const confirmOk = confirm(`您确认要以 [${user.user_name}] 的身份伪装登入其会员中心进行调试吗？这会产生一个隔离的临时调试会话，新页面将在新窗口中弹出。`);
          if (!confirmOk) return;

          try {
            const res = await SPanelAPI.request(`/admin/user/${user.id}/masquerade`, { method: 'POST' });
            const token = res.data.token;
            
            const masqueradeWindow = window.open('/user/dashboard.html', '_blank');
            if (masqueradeWindow) {
              masqueradeWindow.onload = function () {
                masqueradeWindow.localStorage.setItem('spanel_jwt', token);
                masqueradeWindow.localStorage.setItem('spanel_user', JSON.stringify({
                  id: user.id,
                  email: user.email,
                  isAdmin: false
                }));
                masqueradeWindow.location.reload();
              };
            } else {
              alert('新弹窗被浏览器安全拦截，请允许本站弹出窗口。');
            }
          } catch (err) {
            alert('获取伪装令牌失败: ' + err.message);
          }
        },

        async deleteUser(userId) {
          const confirmOk = confirm('调度警告：您确定要物理删除当前用户的账户吗？这会清除其所有订购数据，且数据无法找回！');
          if (!confirmOk) return;

          try {
            await SPanelAPI.request(`/admin/user/${userId}`, { method: 'DELETE' });
            alert('该用户账户已彻底物理清除。');
            await this.fetchUsers();
          } catch (err) {
            alert('删除账户失败: ' + err.message);
          }
        },

        formatBytes(bytes) {
          if (bytes === 0n) return '0 B';
          const k = 1024n;
          const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
          let i = 0;
          let temp = bytes;
          while (temp >= k && i < sizes.length - 1) {
            temp = temp / k;
            i++;
          }
          return temp.toString() + ' ' + sizes[i];
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
