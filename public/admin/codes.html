<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡密激活系统 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="adminCodesPage()">
  
  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/85 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <a href="/admin/dashboard.html" class="font-outfit text-2xl font-bold bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">SPanel</a>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-purple-500/10 text-purple-400 font-semibold border border-purple-500/20">Admin</span>
        </div>
        <div class="flex items-center space-x-5 text-sm overflow-x-auto py-2 custom-scrollbar">
          <a href="/admin/dashboard.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-chart-pie mr-1.5"></i>监控</a>
          <a href="/admin/users.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-user-gear mr-1.5"></i>会员</a>
          <a href="/admin/nodes.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-server mr-1.5"></i>节点</a>
          <a href="/admin/shops.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-bag-shopping mr-1.5"></i>商品</a>
          <a href="/admin/tickets.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-envelope-open-text mr-1.5"></i>工单</a>
          <a href="/admin/announcements.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-bullhorn mr-1.5"></i>公告</a>
          <a href="/admin/coupons.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-ticket mr-1.5"></i>优惠券</a>
          <a href="/admin/codes.html" class="text-purple-400 hover:text-purple-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-barcode mr-1.5"></i>卡密</a>
          <a href="/admin/invites.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-users mr-1.5"></i>推广</a>
          <a href="/admin/audits.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-shield-halved mr-1.5"></i>审计</a>
          <button @click="logout" class="text-rose-400 hover:text-rose-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-right-from-bracket mr-1.5"></i>退出</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h2 class="text-2xl font-semibold font-outfit text-white">充值卡密激活管理</h2>
        <p class="text-slate-400 text-sm mt-1">批量生成余额充值卡密或流量激活码，并集中检索用户的充值使用对账明细流水。</p>
      </div>
      <button @click="modalOpen = true" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-purple-600/25"><i class="fa-solid fa-gears mr-1.5"></i>批量生成激活卡密</button>
    </div>

    <!-- 卡密数据表格 -->
    <div class="glass-card rounded-3xl overflow-hidden">
      <div class="p-6 border-b border-slate-800/80 flex items-center justify-between">
        <h3 class="text-lg font-medium text-white">全站充值卡密明细流水表</h3>
        <span class="text-xs text-slate-400" x-text="'累计活跃卡密: ' + codes.length + ' 张'"></span>
      </div>

      <div class="overflow-x-auto custom-scrollbar">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="border-b border-slate-800/60 bg-slate-900/35">
              <th class="py-4 px-6 text-slate-400 font-semibold">卡密 ID</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">激活码原文</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">卡密类型</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">充值面额</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">状态</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">使用者 (UID)</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">充值激活日期</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="item in codes" :key="item.id">
              <tr class="border-b border-slate-900/40 hover:bg-slate-900/10 transition">
                <td class="py-4 px-6 font-mono text-slate-400" x-text="'#' + item.id"></td>
                <td class="py-4 px-6 font-mono text-white font-semibold select-all" x-text="item.code"></td>
                <td class="py-4 px-6">
                  <span class="text-xs px-2 py-0.5 rounded-full font-medium" 
                        :class="item.type === 1 ? 'bg-indigo-500/10 text-indigo-400' : 'bg-purple-500/10 text-purple-400'"
                        x-text="item.type === 1 ? '余额充值卡' : '流量兑换卡'"></span>
                </td>
                <td class="py-4 px-6 font-mono font-bold" 
                    :class="item.type === 1 ? 'text-emerald-400' : 'text-indigo-400'"
                    x-text="item.type === 1 ? '￥' + item.number : item.number + ' GB'"></td>
                <td class="py-4 px-6">
                  <span class="text-xs px-2 py-0.5 rounded-full font-bold"
                        :class="item.is_used ? 'bg-slate-800 text-slate-500' : 'bg-emerald-500/10 text-emerald-400'"
                        x-text="item.is_used ? '已使用' : '未使用'"></span>
                </td>
                <td class="py-4 px-6 text-slate-300">
                  <template x-if="item.user">
                    <div>
                      <span class="block font-medium" x-text="item.user.userName"></span>
                      <span class="block text-xs font-mono text-slate-500" x-text="item.user.email"></span>
                    </div>
                  </template>
                  <template x-if="!item.user">
                    <span class="text-slate-500 font-mono">-</span>
                  </template>
                </td>
                <td class="py-4 px-6 text-slate-400 text-xs font-mono" x-text="item.is_used ? item.used_at : '未激活'"></td>
              </tr>
            </template>
            <tr x-show="codes.length === 0">
              <td colspan="7" class="py-12 text-center text-slate-500">暂无任何生成卡密激活记录。</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- MODAL: 批量生成卡密 -->
    <div x-show="modalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md" x-cloak>
      <div class="glass-card rounded-3xl w-full max-w-md overflow-hidden shadow-2xl border border-slate-800" @click.away="modalOpen = false">
        <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/25">
          <h3 class="text-lg font-bold text-white font-outfit">批量生成充值激活卡密</h3>
          <button @click="modalOpen = false" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <form @submit.prevent="generateCodes" class="p-6 space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">卡密激活码类型</label>
            <select x-model.number="form.type" class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:border-purple-500 focus:outline-none transition">
              <option value="1">余额充值卡 (用于增加用户钱包余额)</option>
              <option value="2">流量兑换卡 (直接给用户加额定流量/GB)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">单张卡密面额</label>
            <input type="number" x-model.number="form.amount" required min="1" class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:border-purple-500 focus:outline-none transition" placeholder="面值，如填写 50 元余额，或 100 GB流量">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">批量生成数量 (张)</label>
            <input type="number" x-model.number="form.count" required min="1" max="100" class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:border-purple-500 focus:outline-none transition" placeholder="单次生成张数：范围 1-100">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">卡密字符自定义前缀 (选填)</label>
            <input type="text" x-model="form.prefix" class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:border-purple-500 focus:outline-none transition" placeholder="例如：PAY_ 或 SUR_">
          </div>
          <div class="pt-6 border-t border-slate-800 flex justify-end space-x-3">
            <button type="button" @click="modalOpen = false" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-850 px-5 py-2.5 rounded-xl text-sm font-medium transition">取消</button>
            <button type="submit" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-purple-600/20">确认批量制造</button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function adminCodesPage() {
      return {
        codes: [],
        modalOpen: false,
        form: {
          type: 1,
          amount: 50,
          count: 5,
          prefix: ''
        },

        async init() {
          await this.fetchCodes();
        },

        async fetchCodes() {
          try {
            const res = await SPanelAPI.request('/admin/code');
            this.codes = res.data;
          } catch (err) {
            alert('拉取卡密流水失败: ' + err.message);
          }
        },

        async generateCodes() {
          try {
            const res = await SPanelAPI.request('/admin/code', {
              method: 'POST',
              body: JSON.stringify(this.form)
            });
            alert(res.message);
            this.modalOpen = false;
            // 重置表单参数
            this.form = {
              type: 1,
              amount: 50,
              count: 5,
              prefix: ''
            };
            await this.fetchCodes();
          } catch (err) {
            alert('制造充值卡密失败: ' + err.message);
          }
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
