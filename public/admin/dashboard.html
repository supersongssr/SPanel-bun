<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- ECharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="adminDashboardPage()">
  
  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/85 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <span class="font-outfit text-2xl font-bold bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">SPanel</span>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-purple-500/10 text-purple-400 font-semibold border border-purple-500/20">Admin</span>
        </div>
        <div class="flex items-center space-x-6 text-sm">
          <a href="/admin/dashboard.html" class="text-purple-400 hover:text-purple-300 transition font-medium"><i class="fa-solid fa-chart-pie mr-1.5"></i>全局监控</a>
          <a href="/admin/users.html" class="text-slate-400 hover:text-purple-400 transition font-medium"><i class="fa-solid fa-user-gear mr-1.5"></i>会员管理</a>
          <a href="/admin/nodes.html" class="text-slate-400 hover:text-purple-400 transition font-medium"><i class="fa-solid fa-server mr-1.5"></i>节点调度</a>
          <button @click="logout" class="text-rose-400 hover:text-rose-300 transition font-medium"><i class="fa-solid fa-right-from-bracket mr-1.5"></i>退出</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    
    <div class="mb-8">
      <h2 class="text-2xl font-semibold font-outfit text-white">SPanel 全局运营管理控制台</h2>
      <p class="text-slate-400 text-sm mt-2">在这里，您可以集中监控全站总注册量、收益报表、服务器总带宽吞吐量以及近期注册用户增长趋势。</p>
    </div>

    <!-- 关键指标网格 -->
    <div class="grid grid-cols-1 md:grid-cols-5 gap-6 mb-8">
      <div class="glass-card p-6 rounded-2xl">
        <span class="text-slate-500 text-[10px] uppercase font-semibold">全站总注册人数</span>
        <span class="block text-white font-semibold font-outfit text-2xl mt-2" x-text="metrics.total_users">0</span>
      </div>
      <div class="glass-card p-6 rounded-2xl">
        <span class="text-slate-500 text-[10px] uppercase font-semibold">活跃使用会员数</span>
        <span class="block text-purple-400 font-semibold font-outfit text-2xl mt-2" x-text="metrics.active_users">0</span>
      </div>
      <div class="glass-card p-6 rounded-2xl">
        <span class="text-slate-500 text-[10px] uppercase font-semibold">节点服务器数量</span>
        <span class="block text-white font-semibold font-outfit text-2xl mt-2" x-text="metrics.total_nodes">0</span>
      </div>
      <div class="glass-card p-6 rounded-2xl">
        <span class="text-slate-500 text-[10px] uppercase font-semibold">商城累计销售额</span>
        <span class="block text-emerald-400 font-semibold font-outfit text-2xl mt-2" x-text="'￥' + metrics.total_revenue">0.00</span>
      </div>
      <div class="glass-card p-6 rounded-2xl">
        <span class="text-slate-500 text-[10px] uppercase font-semibold">总数据传输开销</span>
        <span class="block text-indigo-400 font-semibold font-outfit text-base mt-3" x-text="totalTrafficStr">0 B</span>
      </div>
    </div>

    <!-- ECharts 曲线监控面板 -->
    <div class="glass-card p-6 rounded-3xl">
      <h3 class="text-lg font-medium text-white mb-6 flex items-center"><i class="fa-solid fa-chart-line text-purple-400 mr-2"></i>近期用户增长趋势分析 (7日注册曲线)</h3>
      <div id="growthChart" class="w-full h-80"></div>
    </div>

  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function adminDashboardPage() {
      return {
        metrics: {
          total_users: 0,
          active_users: 0,
          total_nodes: 0,
          total_revenue: '0.00',
          total_traffic_bytes: '0'
        },
        totalTrafficStr: '0 B',

        async init() {
          await this.fetchDashboardData();
        },

        async fetchDashboardData() {
          try {
            const res = await SPanelAPI.request('/admin/dashboard');
            const data = res.data;
            this.metrics = data.metrics;
            this.totalTrafficStr = this.formatBytes(BigInt(data.metrics.total_traffic_bytes));

            // 初始化 ECharts 数据渲染
            const chartData = data.charts.user_growth || [];
            this.renderChart(chartData);
          } catch (err) {
            console.error('加载管理员首页数据失败:', err.message);
          }
        },

        renderChart(chartData) {
          const chartDom = document.getElementById('growthChart');
          if (!chartDom) return;
          
          const myChart = echarts.init(chartDom, 'dark', { backgroundColor: 'transparent' });
          
          const dates = chartData.map(item => item.date);
          const counts = chartData.map(item => item.count);

          const option = {
            tooltip: {
              trigger: 'axis',
              backgroundColor: '#0f172a',
              borderWidth: 1,
              borderColor: 'rgba(255, 255, 255, 0.1)',
              textStyle: { color: '#f1f5f9' }
            },
            grid: {
              left: '3%',
              right: '4%',
              bottom: '3%',
              containLabel: true
            },
            xAxis: {
              type: 'category',
              boundaryGap: false,
              data: dates,
              axisLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.1)' } },
              axisLabel: { color: '#94a3b8' }
            },
            yAxis: {
              type: 'value',
              splitLine: { lineStyle: { color: 'rgba(255, 255, 255, 0.05)' } },
              axisLabel: { color: '#94a3b8' }
            },
            series: [
              {
                name: '新增注册用户',
                type: 'line',
                smooth: true,
                data: counts,
                lineStyle: {
                  width: 3,
                  color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                    { offset: 0, color: '#818cf8' },
                    { offset: 1, color: '#c084fc' }
                  ])
                },
                showSymbol: false,
                areaStyle: {
                  opacity: 0.1,
                  color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: '#c084fc' },
                    { offset: 1, color: 'transparent' }
                  ])
                }
              }
            ]
          };

          myChart.setOption(option);

          window.addEventListener('resize', () => myChart.resize());
        },

        formatBytes(bytes) {
          if (bytes === 0n) return '0 B';
          const k = 1024n;
          const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
          let i = 0;
          let temp = bytes;
          while (temp >= k && i < sizes.length - 1) {
            temp = temp / k;
            i++;
          }
          return temp.toString() + ' ' + sizes[i];
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
