<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>优惠码管理 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="adminCouponsPage()">
  
  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/85 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <a href="/admin/dashboard.html" class="font-outfit text-2xl font-bold bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">SPanel</a>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-purple-500/10 text-purple-400 font-semibold border border-purple-500/20">Admin</span>
        </div>
        <div class="flex items-center space-x-5 text-sm overflow-x-auto py-2 custom-scrollbar">
          <a href="/admin/dashboard.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-chart-pie mr-1.5"></i>监控</a>
          <a href="/admin/users.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-user-gear mr-1.5"></i>会员</a>
          <a href="/admin/nodes.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-server mr-1.5"></i>节点</a>
          <a href="/admin/shops.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-bag-shopping mr-1.5"></i>商品</a>
          <a href="/admin/tickets.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-envelope-open-text mr-1.5"></i>工单</a>
          <a href="/admin/announcements.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-bullhorn mr-1.5"></i>公告</a>
          <a href="/admin/coupons.html" class="text-purple-400 hover:text-purple-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-ticket mr-1.5"></i>优惠券</a>
          <a href="/admin/codes.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-barcode mr-1.5"></i>卡密</a>
          <a href="/admin/invites.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-users mr-1.5"></i>推广</a>
          <a href="/admin/audits.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-shield-halved mr-1.5"></i>审计</a>
          <button @click="logout" class="text-rose-400 hover:text-rose-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-right-from-bracket mr-1.5"></i>退出</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h2 class="text-2xl font-semibold font-outfit text-white">优惠券折扣码配置</h2>
        <p class="text-slate-400 text-sm mt-1">自主配置生成商品折扣优惠券，支持设定专属抵扣百分比、一次性使用及过期日期属性。</p>
      </div>
      <button @click="modalOpen = true" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-purple-600/25"><i class="fa-solid fa-plus mr-1.5"></i>发布新优惠码</button>
    </div>

    <!-- 优惠券数据表 -->
    <div class="glass-card rounded-3xl overflow-hidden">
      <div class="p-6 border-b border-slate-800/80 flex items-center justify-between">
        <h3 class="text-lg font-medium text-white">活跃优惠码详情账单</h3>
        <span class="text-xs text-slate-400" x-text="'累计配置优惠券: ' + coupons.length + ' 张'"></span>
      </div>

      <div class="overflow-x-auto custom-scrollbar">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="border-b border-slate-800/60 bg-slate-900/35">
              <th class="py-4 px-6 text-slate-400 font-semibold">优惠码ID</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">优惠码原文</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">折扣比例 (百分比)</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">适用商品绑定</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">是否一次性</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">过期截止时间</th>
              <th class="py-4 px-6 text-slate-400 font-semibold text-right">操作管理</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="item in coupons" :key="item.id">
              <tr class="border-b border-slate-900/40 hover:bg-slate-900/10 transition">
                <td class="py-4 px-6 font-mono text-slate-400" x-text="'#' + item.id"></td>
                <td class="py-4 px-6 font-mono text-white font-bold" x-text="item.code"></td>
                <td class="py-4 px-6">
                  <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20" x-text="'-' + item.credit + '% 折扣'"></span>
                </td>
                <td class="py-4 px-6 text-slate-300 text-xs" x-text="item.shop ? '商品ID: ' + item.shop : '全场商品适用'"></td>
                <td class="py-4 px-6 text-slate-400" x-text="item.onetime ? '仅单次' : '可重复使用'"></td>
                <td class="py-4 px-6 text-slate-400 text-xs" x-text="item.expire_str"></td>
                <td class="py-4 px-6 text-right">
                  <button @click="deleteCoupon(item.id)" class="text-rose-400 hover:text-rose-300 transition text-xs font-medium bg-rose-950/40 border border-rose-500/20 px-3 py-1.5 rounded-xl"><i class="fa-solid fa-trash-can mr-1"></i>废除</button>
                </td>
              </tr>
            </template>
            <tr x-show="coupons.length === 0">
              <td colspan="7" class="py-12 text-center text-slate-500">暂无任何优惠码，请点击右上方按钮发布。</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- MODAL: 发布优惠券 -->
    <div x-show="modalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md" x-cloak>
      <div class="glass-card rounded-3xl w-full max-w-md overflow-hidden shadow-2xl border border-slate-800" @click.away="modalOpen = false">
        <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/25">
          <h3 class="text-lg font-bold text-white font-outfit">发布专属折扣优惠码</h3>
          <button @click="modalOpen = false" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <form @submit.prevent="submitCoupon" class="p-6 space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">优惠码原文 (优惠券代码)</label>
            <input type="text" x-model="form.code" required class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:border-purple-500 focus:outline-none transition" placeholder="例如：SUMMER20">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">折扣比率 (填写 1-99 之间的整数)</label>
            <input type="number" x-model.number="form.credit" min="1" max="99" required class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:border-purple-500 focus:outline-none transition" placeholder="填写 20 代表 8 折 (减少 20% 实付)">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">适用商品绑定 (留空适用所有商品)</label>
            <input type="text" x-model="form.shop" class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:border-purple-500 focus:outline-none transition" placeholder="输入适用套餐 ID，例如 1 或者以逗号分隔 1,2">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">优惠到期日期截止</label>
            <input type="datetime-local" x-model="expireDateStr" required class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:border-purple-500 focus:outline-none transition">
          </div>
          <div class="pt-2">
            <label class="flex items-center space-x-3 cursor-pointer">
              <input type="checkbox" x-model="form.onetime" class="rounded border-slate-800 text-purple-600 bg-slate-900 focus:ring-purple-500">
              <span class="text-xs text-slate-300 select-none">一次性使用券 (用户使用一次后立即自动作废)</span>
            </label>
          </div>
          <div class="pt-6 border-t border-slate-800 flex justify-end space-x-3">
            <button type="button" @click="modalOpen = false" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-850 px-5 py-2.5 rounded-xl text-sm font-medium transition">取消</button>
            <button type="submit" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-purple-600/20">确认配发</button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function adminCouponsPage() {
      return {
        coupons: [],
        modalOpen: false,
        expireDateStr: '',
        form: {
          code: '',
          onetime: false,
          expire: 0,
          shop: '',
          credit: 20
        },

        async init() {
          // 初始化默认截止时间为明天此时
          const tomorrow = new Date();
          tomorrow.setDate(tomorrow.getDate() + 7);
          this.expireDateStr = tomorrow.toISOString().substring(0, 16);
          await this.fetchCoupons();
        },

        async fetchCoupons() {
          try {
            const res = await SPanelAPI.request('/admin/coupon');
            this.coupons = res.data;
          } catch (err) {
            alert('拉取优惠券失败: ' + err.message);
          }
        },

        async submitCoupon() {
          // 转换本地时间戳为秒
          const epoch = Math.floor(new Date(this.expireDateStr).getTime() / 1000);
          if (isNaN(epoch)) {
            alert('请输入正确的到期日期！');
            return;
          }
          this.form.expire = epoch;

          try {
            await SPanelAPI.request('/admin/coupon', {
              method: 'POST',
              body: JSON.stringify(this.form)
            });
            this.modalOpen = false;
            // 重置表单
            this.form = {
              code: '',
              onetime: false,
              expire: 0,
              shop: '',
              credit: 20
            };
            await this.fetchCoupons();
          } catch (err) {
            alert('创建优惠码失败: ' + err.message);
          }
        },

        async deleteCoupon(id) {
          if (!confirm('您确定要废除并物理删除该折扣优惠券吗？')) return;
          try {
            await SPanelAPI.request(`/admin/coupon/${id}`, { method: 'DELETE' });
            await this.fetchCoupons();
          } catch (err) {
            alert('删除优惠券失败: ' + err.message);
          }
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
