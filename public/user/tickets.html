<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工单支持 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="ticketsPage()">
  
  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <a href="/user/dashboard.html" class="font-outfit text-2xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">SPanel</a>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-semibold border border-indigo-500/20">Member</span>
        </div>
        <div class="flex items-center space-x-6 text-sm overflow-x-auto scrollbar-none">
          <a href="/user/dashboard.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-chart-line mr-1.5"></i>控制台</a>
          <a href="/user/nodes.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-server mr-1.5"></i>节点列表</a>
          <a href="/user/relay.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-route mr-1.5"></i>中转规则</a>
          <a href="/user/shop.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-store mr-1.5"></i>套餐商店</a>
          <a href="/user/code.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-credit-card mr-1.5"></i>卡密充值</a>
          <a href="/user/invite.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-gift mr-1.5"></i>推广联盟</a>
          <a href="/user/tickets.html" class="text-indigo-400 hover:text-indigo-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-ticket mr-1.5"></i>工单支持</a>
          
          <!-- 用户下拉子菜单 -->
          <div class="relative" x-data="{ open: false }" @click.away="open = false">
            <button @click="open = !open" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap focus:outline-none flex items-center">
              <i class="fa-solid fa-user-gear mr-1.5"></i>我的账户<i class="fa-solid fa-chevron-down text-[10px] ml-1 transition" :class="open ? 'rotate-180' : ''"></i>
            </button>
            <div class="absolute right-0 mt-2 w-40 rounded-xl bg-slate-900 border border-slate-800 shadow-xl py-1 z-50" x-show="open" x-transition>
              <a href="/user/profile.html" class="block px-4 py-2 text-xs text-slate-300 hover:bg-slate-800 transition"><i class="fa-solid fa-user mr-2"></i>个人中心</a>
              <a href="/user/edit.html" class="block px-4 py-2 text-xs text-slate-300 hover:bg-slate-800 transition"><i class="fa-solid fa-shield-halved mr-2"></i>安全设置</a>
              <hr class="border-slate-800 my-1">
              <button @click="logout" class="w-full text-left px-4 py-2 text-xs text-rose-400 hover:bg-rose-950/20 transition"><i class="fa-solid fa-right-from-bracket mr-2"></i>退出登录</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    
    <div class="mb-8 flex justify-between items-center">
      <div>
        <h2 class="text-2xl font-semibold font-outfit text-white">工单支持中心</h2>
        <p class="text-slate-400 text-sm mt-2">在这里，您可以方便地查看历史发起的客服提问列表。点击对应的工单，即可进入聊天对话流进行追问。</p>
      </div>
      <a href="/user/ticket-create.html" class="bg-gradient-to-r from-indigo-500 to-pink-500 hover:brightness-110 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition active:scale-[0.98]">
        <i class="fa-solid fa-plus mr-1.5"></i>新建议工单
      </a>
    </div>

    <!-- 工单列表 -->
    <div class="glass-card p-6 rounded-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-300">
          <thead>
            <tr class="border-b border-slate-800 text-slate-500 font-semibold">
              <th class="py-3">工单编码</th>
              <th class="py-3">工单主题</th>
              <th class="py-3">处理状态</th>
              <th class="py-3 text-right">最后活跃时间</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800/40">
            <template x-for="tkt in tickets" :key="tkt.id">
              <tr class="hover:bg-slate-900/50 cursor-pointer transition" @click="goToTicket(tkt.id)">
                <td class="py-4 font-mono text-slate-400" x-text="'#' + tkt.id"></td>
                <td class="py-4 font-medium text-slate-200" x-text="tkt.title"></td>
                <td class="py-4">
                  <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase border"
                        :class="tkt.status === 'open' ? 'text-indigo-400 bg-indigo-500/10 border-indigo-500/20' : 'text-slate-500 bg-slate-900 border-slate-800'"
                        x-text="tkt.status === 'open' ? '受理处理中' : '已结单'"></span>
                </td>
                <td class="py-4 font-mono text-slate-400 text-right" x-text="tkt.datetime"></td>
              </tr>
            </template>
            <template x-if="tickets.length === 0">
              <tr>
                <td colspan="4" class="py-12 text-center text-slate-650 text-xs">
                  <i class="fa-solid fa-comments text-3xl text-slate-800 mb-3 block"></i>
                  您目前没有任何历史工单咨询记录。
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function ticketsPage() {
      return {
        tickets: [],

        async init() {
          await this.fetchTickets();
        },

        async fetchTickets() {
          try {
            const res = await SPanelAPI.request('/user/ticket');
            this.tickets = res.data || [];
          } catch (err) {
            console.error('拉取工单列表失败：' + err.message);
          }
        },

        goToTicket(id) {
          window.location.href = `/user/ticket-view.html?id=${id}`;
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
