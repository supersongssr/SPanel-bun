<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>套餐商店 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .neon-border::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 1.5rem;
      padding: 2px;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="shopPage()">
  
  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <span class="font-outfit text-2xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">SPanel</span>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-semibold border border-indigo-500/20">Member</span>
        </div>
        <div class="flex items-center space-x-6 text-sm">
          <a href="/user/dashboard.html" class="text-slate-400 hover:text-indigo-400 transition font-medium"><i class="fa-solid fa-chart-line mr-1.5"></i>控制台</a>
          <a href="/user/nodes.html" class="text-slate-400 hover:text-indigo-400 transition font-medium"><i class="fa-solid fa-server mr-1.5"></i>节点列表</a>
          <a href="/user/shop.html" class="text-indigo-400 hover:text-indigo-300 transition font-medium"><i class="fa-solid fa-store mr-1.5"></i>套餐商店</a>
          <a href="/user/tickets.html" class="text-slate-400 hover:text-indigo-400 transition font-medium"><i class="fa-solid fa-ticket mr-1.5"></i>工单支持</a>
          <button @click="logout" class="text-rose-400 hover:text-rose-300 transition font-medium"><i class="fa-solid fa-right-from-bracket mr-1.5"></i>退出</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    <div class="flex items-center justify-between mb-8 border-b border-slate-800 pb-6">
      <div>
        <h2 class="text-2xl font-semibold font-outfit text-white">订阅套餐服务商店</h2>
        <p class="text-slate-400 text-sm mt-2">选择最适合您的大带宽高速网络加速解决方案，支持动态流量叠加或VIP专属线路解锁。</p>
      </div>
      <!-- 钱包余额展示 -->
      <div class="bg-slate-900 border border-slate-800 px-6 py-3 rounded-2xl text-right">
        <span class="block text-slate-500 text-[10px] uppercase font-semibold">我的账户可用余额</span>
        <span class="block text-emerald-400 font-semibold font-outfit text-xl mt-1" x-text="'￥' + userMoney">0.00</span>
      </div>
    </div>

    <!-- 商品列表格网 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <template x-for="item in shops" :key="item.id">
        <div class="glass-card rounded-3xl p-6 relative overflow-hidden transition hover:scale-[1.02] flex flex-col justify-between"
             :class="item.auto_renew ? 'neon-border border border-white/5' : 'border border-slate-800/80'">
          <div>
            <!-- 套餐标记 -->
            <div class="flex items-center justify-between mb-4">
              <span class="text-xs px-2.5 py-0.5 rounded-full font-semibold font-outfit uppercase border text-indigo-400 border-indigo-500/20 bg-indigo-500/5" x-text="item.auto_renew ? '支持自动续费' : '单次购买'"></span>
            </div>

            <h3 class="text-xl font-semibold text-white tracking-tight font-outfit" x-text="item.name"></h3>
            
            <div class="my-6">
              <span class="text-slate-500 text-sm">￥</span>
              <span class="text-4xl font-bold font-outfit tracking-tight text-white" x-text="item.price"></span>
              <span class="text-slate-500 text-xs"> / 元</span>
            </div>

            <!-- 服务描述列表 -->
            <div class="bg-slate-950/60 p-4 rounded-2xl border border-slate-900 space-y-3">
              <div class="flex items-center text-xs text-slate-300">
                <i class="fa-solid fa-circle-check text-indigo-400 mr-2"></i>
                <span x-text="item.content"></span>
              </div>
              <div class="flex items-center text-xs text-slate-400">
                <i class="fa-solid fa-circle-check text-indigo-400/50 mr-2"></i>
                <span x-text="item.auto_reset_bandwidth ? '续费重置并刷新流量' : '流量永久累计叠加'"></span>
              </div>
            </div>
          </div>

          <div class="mt-8">
            <button @click="openCheckoutModal(item)" class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white rounded-xl py-3 text-sm font-semibold hover:brightness-110 active:scale-[0.98] transition">
              立即购买订阅
            </button>
          </div>
        </div>
      </template>

      <template x-if="shops.length === 0">
        <div class="col-span-full text-center py-12 text-slate-500 text-xs">暂无可购套餐商品。</div>
      </template>
    </div>

    <!-- 结算模态弹窗 (Alpine.js 交互式弹出) -->
    <div class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-50" x-show="showCheckout" x-transition>
      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full mx-4 relative overflow-hidden" @click.away="closeCheckoutModal">
        <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-indigo-500/5 blur-[50px] rounded-full"></div>
        
        <h3 class="text-xl font-semibold text-white mb-6 flex items-center"><i class="fa-solid fa-cart-shopping text-indigo-400 mr-2"></i>安全收银台</h3>

        <div class="space-y-4">
          <div class="flex justify-between border-b border-slate-800 pb-3 text-sm">
            <span class="text-slate-500">所购套餐</span>
            <span class="text-white font-semibold" x-text="selectedShop?.name"></span>
          </div>
          <div class="flex justify-between border-b border-slate-800 pb-3 text-sm">
            <span class="text-slate-500">套餐原价</span>
            <span class="text-white font-semibold font-outfit" x-text="'￥' + selectedShop?.price"></span>
          </div>
          
          <!-- 优惠券码输入 -->
          <div>
            <label class="block text-slate-400 text-xs mb-2">使用优惠码 (如有)</label>
            <div class="flex space-x-2">
              <input type="text" x-model="couponCode" placeholder="输入折扣优惠码" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
              <button @click="applyCoupon" :disabled="couponLoading" class="bg-slate-900 border border-slate-800 hover:border-indigo-500/50 text-slate-300 px-4 rounded-xl text-xs font-semibold transition disabled:opacity-50">
                <span x-show="!couponLoading">应用</span>
                <span x-show="couponLoading"><i class="fa-solid fa-spinner animate-spin"></i></span>
              </button>
            </div>
            <p class="text-[10px] text-emerald-400 mt-1" x-show="couponDiscountMsg" x-text="couponDiscountMsg"></p>
          </div>

          <div class="flex justify-between pt-3 text-sm font-semibold">
            <span class="text-slate-400">应付折后总金额</span>
            <span class="text-rose-400 font-outfit text-lg" x-text="'￥' + finalPrice"></span>
          </div>
        </div>

        <div class="mt-8 flex space-x-3">
          <button @click="closeCheckoutModal" class="flex-1 bg-slate-950 border border-slate-800 hover:border-rose-500/30 text-slate-400 hover:text-slate-100 rounded-xl py-3 text-xs transition">
            取消订单
          </button>
          <button @click="confirmBuy" :disabled="checkoutLoading" class="flex-1 bg-gradient-to-r from-indigo-500 to-pink-500 text-white rounded-xl py-3 text-xs font-semibold hover:brightness-110 transition disabled:opacity-50">
            <span x-show="!checkoutLoading">确认支付并扣款</span>
            <span x-show="checkoutLoading"><i class="fa-solid fa-spinner animate-spin mr-1"></i>支付中...</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function shopPage() {
      return {
        shops: [],
        userMoney: '0.00',
        showCheckout: false,
        selectedShop: null,
        couponCode: '',
        couponDiscountMsg: '',
        couponCredit: 0,
        couponLoading: false,
        checkoutLoading: false,
        finalPrice: '0.00',

        async init() {
          await this.fetchUserBalance();
          await this.fetchShops();
        },

        async fetchUserBalance() {
          try {
            const profile = await SPanelAPI.request('/user/profile');
            this.userMoney = profile.data.money;
          } catch(e) {}
        },

        async fetchShops() {
          try {
            const res = await SPanelAPI.request('/user/shop');
            this.shops = res.data || [];
          } catch (err) {
            console.error(err.message);
          }
        },

        openCheckoutModal(shop) {
          this.selectedShop = shop;
          this.couponCode = '';
          this.couponDiscountMsg = '';
          this.couponCredit = 0;
          this.finalPrice = shop.price;
          this.showCheckout = true;
        },

        closeCheckoutModal() {
          this.showCheckout = false;
          this.selectedShop = null;
        },

        async applyCoupon() {
          if (!this.couponCode.trim()) return;

          this.couponLoading = true;
          try {
            const res = await SPanelAPI.request('/user/coupon/check', {
              method: 'POST',
              body: JSON.stringify({
                code: this.couponCode,
                shop_id: this.selectedShop.id
              })
            });

            this.couponCredit = res.data.credit;
            const creditNum = Number(this.couponCredit);
            const originalPrice = parseFloat(this.selectedShop.price);

            let price = originalPrice;
            if (creditNum > 0 && creditNum < 100) {
              // 百分比折扣 (如 20 代表 8 折，扣除 20%)
              price = originalPrice * (100 - creditNum) / 100;
              this.couponDiscountMsg = `已成功应用优折码！尊享 ${10 - (creditNum/10)} 折优惠优惠。`;
            } else if (creditNum >= 100) {
              // 直减金额
              price = originalPrice - creditNum;
              this.couponDiscountMsg = `已成功应用抵金码！立减 ￥${creditNum} 元。`;
            }

            if (price < 0) price = 0;
            this.finalPrice = price.toFixed(2);
          } catch (err) {
            this.couponDiscountMsg = '';
            alert(err.message || '优惠券校验失败，可能不支持该商品。');
          } finally {
            this.couponLoading = false;
          }
        },

        async confirmBuy() {
          this.checkoutLoading = true;
          try {
            const res = await SPanelAPI.request('/user/buy', {
              method: 'POST',
              body: JSON.stringify({
                shop_id: this.selectedShop.id,
                coupon_code: this.couponCode || undefined
              })
            });

            alert(res.message || '恭喜您购买套餐成功！');
            this.closeCheckoutModal();
            await this.fetchUserBalance();
          } catch (err) {
            alert(err.message || '扣款结账失败，请检查您的余额。');
          } finally {
            this.checkoutLoading = false;
          }
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
