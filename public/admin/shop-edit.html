<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修改套餐商品 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="adminShopEditPage()">
  
  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/85 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <a href="/admin/dashboard.html" class="font-outfit text-2xl font-bold bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">SPanel</a>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-purple-500/10 text-purple-400 font-semibold border border-purple-500/20">Admin</span>
        </div>
        <div class="flex items-center space-x-5 text-sm overflow-x-auto py-2 custom-scrollbar">
          <a href="/admin/dashboard.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-chart-pie mr-1.5"></i>监控</a>
          <a href="/admin/users.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-user-gear mr-1.5"></i>会员</a>
          <a href="/admin/nodes.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-server mr-1.5"></i>节点</a>
          <a href="/admin/shops.html" class="text-purple-400 hover:text-purple-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-bag-shopping mr-1.5"></i>商品</a>
          <a href="/admin/tickets.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-envelope-open-text mr-1.5"></i>工单</a>
          <a href="/admin/announcements.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-bullhorn mr-1.5"></i>公告</a>
          <a href="/admin/coupons.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-ticket mr-1.5"></i>优惠券</a>
          <a href="/admin/codes.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-barcode mr-1.5"></i>卡密</a>
          <a href="/admin/invites.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-users mr-1.5"></i>推广</a>
          <a href="/admin/audits.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-shield-halved mr-1.5"></i>审计</a>
          <button @click="logout" class="text-rose-400 hover:text-rose-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-right-from-bracket mr-1.5"></i>退出</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    <div class="mb-8 flex items-center justify-between">
      <div>
        <h2 class="text-2xl font-semibold font-outfit text-white" x-text="'编辑商品套餐: ' + form.name">修改套餐商品</h2>
        <p class="text-slate-400 text-sm mt-1">更新商品的销售定价、流量包重置以及上下架状态。</p>
      </div>
      <a href="/admin/shops.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-750 px-4 py-2 rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-chevron-left mr-1.5"></i>返回商品列表</a>
    </div>

    <!-- 表单卡片 -->
    <div class="glass-card rounded-3xl p-8 border border-slate-800/80">
      <form @submit.prevent="submitForm" class="space-y-6">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">商品套餐名称</label>
          <input type="text" required x-model="form.name" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">销售价格 (元)</label>
          <input type="text" required x-model="form.price" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition font-mono">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">套餐规格/参数详情内容说明</label>
          <textarea required x-model="form.content" rows="6" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:border-purple-500 focus:outline-none transition resize-none custom-scrollbar"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-6 pt-2">
          <label class="flex items-center space-x-3 cursor-pointer">
            <input type="checkbox" x-model="form.auto_renew" class="rounded border-slate-800 text-purple-600 bg-slate-900 focus:ring-purple-500">
            <span class="text-xs text-slate-300 select-none">支持自动扣费续期</span>
          </label>
          <label class="flex items-center space-x-3 cursor-pointer">
            <input type="checkbox" x-model="form.auto_reset_bandwidth" class="rounded border-slate-800 text-purple-600 bg-slate-900 focus:ring-purple-500">
            <span class="text-xs text-slate-300 select-none">次月/新周期自动重置总可用流量</span>
          </label>
        </div>

        <div class="pt-2">
          <label class="flex items-center space-x-3 cursor-pointer">
            <input type="checkbox" x-model="form.status" class="rounded border-slate-800 text-purple-600 bg-slate-900 focus:ring-purple-500">
            <span class="text-xs text-slate-300 select-none">上架在售</span>
          </label>
        </div>

        <div class="pt-6 border-t border-slate-800 flex justify-end space-x-4">
          <a href="/admin/shops.html" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-850 px-6 py-3 rounded-xl text-xs font-semibold transition">取消</a>
          <button type="submit" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white px-6 py-3 rounded-xl text-xs font-semibold transition shadow-lg shadow-purple-600/20">保存商品套餐</button>
        </div>
      </form>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function adminShopEditPage() {
      return {
        shopId: null,
        form: {
          name: '',
          price: '',
          content: '',
          auto_renew: false,
          auto_reset_bandwidth: false,
          status: false
        },

        async init() {
          const urlParams = new URLSearchParams(window.location.search);
          const id = urlParams.get('id');
          if (!id) {
            alert('缺少商品 ID，无法编辑！');
            window.location.replace('/admin/shops.html');
            return;
          }
          this.shopId = id;
          await this.fetchShopDetails();
        },

        async fetchShopDetails() {
          try {
            const res = await SPanelAPI.request(`/admin/shop/${this.shopId}`);
            this.form = res.data;
          } catch (err) {
            alert('获取商品详情失败: ' + err.message);
            window.location.replace('/admin/shops.html');
          }
        },

        async submitForm() {
          try {
            await SPanelAPI.request(`/admin/shop/${this.shopId}`, {
              method: 'PUT',
              body: JSON.stringify(this.form)
            });
            alert('商品套餐配置成功更新！');
            window.location.replace('/admin/shops.html');
          } catch (err) {
            alert('更新失败: ' + err.message);
          }
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
