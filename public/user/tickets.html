<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工单支持 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="ticketsPage()">
  
  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <span class="font-outfit text-2xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">SPanel</span>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-semibold border border-indigo-500/20">Member</span>
        </div>
        <div class="flex items-center space-x-6 text-sm">
          <a href="/user/dashboard.html" class="text-slate-400 hover:text-indigo-400 transition font-medium"><i class="fa-solid fa-chart-line mr-1.5"></i>控制台</a>
          <a href="/user/nodes.html" class="text-slate-400 hover:text-indigo-400 transition font-medium"><i class="fa-solid fa-server mr-1.5"></i>节点列表</a>
          <a href="/user/shop.html" class="text-slate-400 hover:text-indigo-400 transition font-medium"><i class="fa-solid fa-store mr-1.5"></i>套餐商店</a>
          <a href="/user/tickets.html" class="text-indigo-400 hover:text-indigo-300 transition font-medium"><i class="fa-solid fa-ticket mr-1.5"></i>工单支持</a>
          <button @click="logout" class="text-rose-400 hover:text-rose-300 transition font-medium"><i class="fa-solid fa-right-from-bracket mr-1.5"></i>退出</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- 左侧：工单列表 & 创建入口 -->
      <div class="space-y-6">
        <div class="glass-card p-6 rounded-2xl">
          <div class="flex items-center justify-between mb-6">
            <h3 class="text-lg font-medium text-white">工单支持列表</h3>
            <button @click="openCreateModal" class="bg-indigo-500 text-white px-3 py-1.5 rounded-xl text-xs font-semibold hover:bg-indigo-600 transition">
              新建议工单
            </button>
          </div>

          <div class="space-y-3 max-h-[400px] overflow-y-auto">
            <template x-for="tkt in tickets" :key="tkt.id">
              <div class="bg-slate-950/80 p-4 rounded-xl border cursor-pointer transition hover:border-slate-700"
                   :class="selectedTkt?.id === tkt.id ? 'border-indigo-500/50 bg-indigo-500/5' : 'border-slate-800'"
                   @click="selectTicket(tkt)">
                <div class="flex items-center justify-between">
                  <span class="text-xs text-slate-500" x-text="tkt.datetime"></span>
                  <span class="text-[9px] px-2 py-0.5 rounded-full font-bold uppercase"
                        :class="tkt.status === 'open' ? 'text-indigo-400 bg-indigo-500/10 border border-indigo-500/20' : 'text-slate-500 bg-slate-900 border border-slate-800'"
                        x-text="tkt.status === 'open' ? '开启中' : '已结单'"></span>
                </div>
                <h4 class="font-medium text-sm text-slate-100 mt-2 line-clamp-1" x-text="tkt.title"></h4>
              </div>
            </template>
            <template x-if="tickets.length === 0">
              <div class="text-center py-8 text-slate-500 text-xs">暂无任何历史客服工单记录。</div>
            </template>
          </div>
        </div>
      </div>

      <!-- 右侧：工单聊天时间轴对话区 -->
      <div class="lg:col-span-2">
        <div class="glass-card rounded-2xl h-[550px] flex flex-col justify-between overflow-hidden">
          
          <!-- 未选择工单提示 -->
          <div class="flex-1 flex flex-col items-center justify-center text-center p-8 text-slate-500" x-show="!selectedTkt">
            <i class="fa-solid fa-comments text-4xl mb-4 text-slate-700"></i>
            <h4 class="font-medium text-slate-300">还没有选择工单会话</h4>
            <p class="text-xs mt-2 max-w-xs">请在左侧列表中点击选择任一历史工单进行追问，或创建一个新工单向客服提交诉求。</p>
          </div>

          <!-- 选定工单会话详情区 -->
          <template x-if="selectedTkt">
            <div class="flex-1 flex flex-col justify-between h-full">
              <!-- 会话顶部标题栏 -->
              <div class="border-b border-slate-800/80 px-6 py-4 bg-slate-950/20 flex items-center justify-between">
                <div>
                  <h3 class="font-semibold text-white text-base" x-text="selectedTkt.title"></h3>
                  <span class="text-[10px] text-slate-500" x-text="'工单 ID: ' + selectedTkt.id"></span>
                </div>
                <span class="text-xs px-2.5 py-0.5 rounded-full font-bold uppercase"
                      :class="selectedTktDetail?.status === 'open' ? 'text-indigo-400 bg-indigo-500/10 border border-indigo-500/20' : 'text-slate-500 bg-slate-900 border border-slate-800'"
                      x-text="selectedTktDetail?.status === 'open' ? '服务专员受理中' : '工单已关闭'"></span>
              </div>

              <!-- 对话流滚动区 -->
              <div class="flex-1 overflow-y-auto p-6 space-y-4 max-h-[350px]">
                <template x-for="chat in selectedTktDetail?.chat_flow" :key="chat.id">
                  <div class="flex flex-col" :class="chat.role === 'user' ? 'items-end' : 'items-start'">
                    <div class="flex items-center space-x-2 text-[10px] text-slate-500 mb-1">
                      <span class="font-semibold" x-text="chat.role === 'user' ? '我' : '系统客服专员'"></span>
                      <span x-text="chat.datetime"></span>
                    </div>
                    <div class="p-3.5 rounded-2xl text-xs max-w-md leading-relaxed"
                         :class="chat.role === 'user' ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-slate-950 text-slate-200 border border-slate-800 rounded-tl-none'"
                         x-text="chat.content"></div>
                  </div>
                </template>
              </div>

              <!-- 会话底栏输入框 (如果工单为 open 状态) -->
              <div class="border-t border-slate-800/80 p-4 bg-slate-950/30">
                <template x-if="selectedTktDetail?.status === 'open'">
                  <div class="flex space-x-3">
                    <input type="text" x-model="replyContent" placeholder="在此输入追加追问内容..." @keydown.enter="sendReply" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                    <button @click="sendReply" :disabled="replyLoading" class="bg-indigo-500 hover:bg-indigo-600 text-white px-5 rounded-xl text-xs font-semibold transition disabled:opacity-50 flex items-center justify-center">
                      <span x-show="!replyLoading">发送</span>
                      <span x-show="replyLoading"><i class="fa-solid fa-spinner animate-spin"></i></span>
                    </button>
                  </div>
                </template>
                <template x-if="selectedTktDetail?.status !== 'open'">
                  <div class="text-center py-2 text-xs text-slate-600 bg-slate-950/50 border border-slate-900 rounded-xl">
                    <i class="fa-solid fa-lock mr-1.5"></i>本工单已被结单处理，已锁定会话。如有其他问题请新建工单。
                  </div>
                </template>
              </div>

            </div>
          </template>

        </div>
      </div>

    </div>

    <!-- 弹窗：创建新工单 -->
    <div class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-50" x-show="showCreateModal" x-transition>
      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full mx-4" @click.away="closeCreateModal">
        <h3 class="text-xl font-semibold text-white mb-6 flex items-center"><i class="fa-solid fa-pen-to-square text-indigo-400 mr-2"></i>提交新客服工单</h3>

        <div class="space-y-4">
          <div>
            <label class="block text-slate-300 text-xs font-semibold mb-2">工单标题</label>
            <input type="text" x-model="newTitle" placeholder="简要描述您遇到的技术/账务问题" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 transition">
          </div>
          <div>
            <label class="block text-slate-300 text-xs font-semibold mb-2">详细问题描述</label>
            <textarea x-model="newContent" rows="5" placeholder="请详细提供您的具体报错内容、重现路径，以便我们的网络工程师快速为您排查解决。" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 transition"></textarea>
          </div>
        </div>

        <div class="mt-8 flex space-x-3">
          <button @click="closeCreateModal" class="flex-1 bg-slate-950 border border-slate-800 hover:border-rose-500/30 text-slate-400 rounded-xl py-3 text-xs transition">
            取消
          </button>
          <button @click="submitNewTicket" :disabled="createLoading" class="flex-1 bg-gradient-to-r from-indigo-500 to-pink-500 text-white rounded-xl py-3 text-xs font-semibold hover:brightness-110 transition disabled:opacity-50">
            <span x-show="!createLoading">提交工单</span>
            <span x-show="createLoading"><i class="fa-solid fa-spinner animate-spin mr-1"></i>提交中...</span>
          </button>
        </div>
      </div>
    </div>

  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function ticketsPage() {
      return {
        tickets: [],
        selectedTkt: null,
        selectedTktDetail: null,
        replyContent: '',
        replyLoading: false,
        showCreateModal: false,
        newTitle: '',
        newContent: '',
        createLoading: false,

        async init() {
          await this.fetchTickets();
        },

        async fetchTickets() {
          try {
            const res = await SPanelAPI.request('/user/ticket');
            this.tickets = res.data || [];
          } catch (err) {
            console.error(err.message);
          }
        },

        async selectTicket(tkt) {
          this.selectedTkt = tkt;
          this.replyContent = '';
          this.selectedTktDetail = null;

          try {
            const res = await SPanelAPI.request(`/user/ticket/${tkt.id}`);
            this.selectedTktDetail = res.data;
          } catch (err) {
            alert(err.message || '获取工单详情失败。');
          }
        },

        async sendReply() {
          if (!this.replyContent.trim()) return;

          this.replyLoading = true;
          try {
            await SPanelAPI.request(`/user/ticket/${this.selectedTkt.id}`, {
              method: 'PUT',
              body: JSON.stringify({
                content: this.replyContent
              })
            });

            this.replyContent = '';
            // 重新刷新详情以看到最新回复
            await this.selectTicket(this.selectedTkt);
          } catch (err) {
            alert(err.message || '追问提交失败。');
          } finally {
            this.replyLoading = false;
          }
        },

        openCreateModal() {
          this.newTitle = '';
          this.newContent = '';
          this.showCreateModal = true;
        },

        closeCreateModal() {
          this.showCreateModal = false;
        },

        async submitNewTicket() {
          if (!this.newTitle.trim() || !this.newContent.trim()) {
            alert('标题和内容均不能为空！');
            return;
          }

          this.createLoading = true;
          try {
            await SPanelAPI.request('/user/ticket', {
              method: 'POST',
              body: JSON.stringify({
                title: this.newTitle,
                content: this.newContent
              })
            });

            alert('工单已成功提交！我们的支持团队会快速为您处理。');
            this.closeCreateModal();
            await this.fetchTickets();
          } catch (err) {
            alert(err.message || '提交工单失败，请稍后再试。');
          } finally {
            this.createLoading = false;
          }
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
