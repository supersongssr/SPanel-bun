<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品与订单管理 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link class="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="adminShopsPage()">
  
  <!-- 顶部导航栏 -->
  <nav x-data="{ mobileMenuOpen: false }" class="border-b border-slate-800 bg-slate-950/85 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3 flex-shrink-0">
          <a href="/admin/dashboard.html" class="font-outfit text-2xl font-bold bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">SPanel</a>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-purple-500/10 text-purple-400 font-semibold border border-purple-500/20">Admin</span>
        </div>
        
        <!-- Desktop Menu -->
        <div class="hidden lg:flex items-center space-x-5 text-sm">
          <a href="/admin/dashboard.html" class="transition font-medium whitespace-nowrap" :class="location.pathname.endsWith('/dashboard.html') ? 'text-purple-400 hover:text-purple-300' : 'text-slate-400 hover:text-purple-400'"><i class="fa-solid fa-chart-pie mr-1.5"></i>监控</a>
          <a href="/admin/users.html" class="transition font-medium whitespace-nowrap" :class="location.pathname.includes('/user') ? 'text-purple-400 hover:text-purple-300' : 'text-slate-400 hover:text-purple-400'"><i class="fa-solid fa-user-gear mr-1.5"></i>会员</a>
          <a href="/admin/nodes.html" class="transition font-medium whitespace-nowrap" :class="location.pathname.includes('/node') ? 'text-purple-400 hover:text-purple-300' : 'text-slate-400 hover:text-purple-400'"><i class="fa-solid fa-server mr-1.5"></i>节点</a>
          <a href="/admin/shops.html" class="transition font-medium whitespace-nowrap" :class="location.pathname.includes('/shop') ? 'text-purple-400 hover:text-purple-300' : 'text-slate-400 hover:text-purple-400'"><i class="fa-solid fa-bag-shopping mr-1.5"></i>商品</a>
          <a href="/admin/tickets.html" class="transition font-medium whitespace-nowrap" :class="location.pathname.includes('/ticket') ? 'text-purple-400 hover:text-purple-300' : 'text-slate-400 hover:text-purple-400'"><i class="fa-solid fa-envelope-open-text mr-1.5"></i>工单</a>
          <a href="/admin/announcements.html" class="transition font-medium whitespace-nowrap" :class="location.pathname.includes('/announcement') ? 'text-purple-400 hover:text-purple-300' : 'text-slate-400 hover:text-purple-400'"><i class="fa-solid fa-bullhorn mr-1.5"></i>公告</a>
          <a href="/admin/coupons.html" class="transition font-medium whitespace-nowrap" :class="location.pathname.includes('/coupon') ? 'text-purple-400 hover:text-purple-300' : 'text-slate-400 hover:text-purple-400'"><i class="fa-solid fa-ticket mr-1.5"></i>优惠券</a>
          <a href="/admin/codes.html" class="transition font-medium whitespace-nowrap" :class="location.pathname.includes('/code') ? 'text-purple-400 hover:text-purple-300' : 'text-slate-400 hover:text-purple-400'"><i class="fa-solid fa-barcode mr-1.5"></i>卡密</a>
          <a href="/admin/invites.html" class="transition font-medium whitespace-nowrap" :class="location.pathname.includes('/invite') ? 'text-purple-400 hover:text-purple-300' : 'text-slate-400 hover:text-purple-400'"><i class="fa-solid fa-users mr-1.5"></i>推广</a>
          <a href="/admin/audits.html" class="transition font-medium whitespace-nowrap" :class="location.pathname.includes('/audit') ? 'text-purple-400 hover:text-purple-300' : 'text-slate-400 hover:text-purple-400'"><i class="fa-solid fa-shield-halved mr-1.5"></i>审计</a>
          <a href="/admin/settings.html" class="transition font-medium whitespace-nowrap" :class="location.pathname.includes('/setting') ? 'text-purple-400 hover:text-purple-300' : 'text-slate-400 hover:text-purple-400'"><i class="fa-solid fa-gears mr-1.5"></i>设置</a>
          <a href="/user/dashboard.html" class="text-indigo-400 hover:text-indigo-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-circle-arrow-left mr-1.5"></i>用户中心</a>
          <button @click="logout" class="text-rose-400 hover:text-rose-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-right-from-bracket mr-1.5"></i>退出</button>
        </div>

        <!-- Mobile Hamburger Button -->
        <div class="flex items-center lg:hidden">
          <button @click="mobileMenuOpen = !mobileMenuOpen" class="text-slate-400 hover:text-white focus:outline-none p-2 rounded-lg bg-slate-900 border border-slate-800">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
              <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile Menu Overlay -->
    <div x-show="mobileMenuOpen" x-transition class="lg:hidden border-t border-slate-800 bg-slate-950 px-4 py-3 space-y-2 max-h-[calc(100vh-4rem)] overflow-y-auto">
      <a href="/admin/dashboard.html" class="block px-3 py-2 rounded-xl text-base font-medium transition" :class="location.pathname.endsWith('/dashboard.html') ? 'bg-purple-500/10 text-purple-400' : 'text-slate-400 hover:bg-slate-900 hover:text-purple-400'"><i class="fa-solid fa-chart-pie mr-2"></i>监控</a>
      <a href="/admin/users.html" class="block px-3 py-2 rounded-xl text-base font-medium transition" :class="location.pathname.includes('/user') ? 'bg-purple-500/10 text-purple-400' : 'text-slate-400 hover:bg-slate-900 hover:text-purple-400'"><i class="fa-solid fa-user-gear mr-2"></i>会员</a>
      <a href="/admin/nodes.html" class="block px-3 py-2 rounded-xl text-base font-medium transition" :class="location.pathname.includes('/node') ? 'bg-purple-500/10 text-purple-400' : 'text-slate-400 hover:bg-slate-900 hover:text-purple-400'"><i class="fa-solid fa-server mr-2"></i>节点</a>
      <a href="/admin/shops.html" class="block px-3 py-2 rounded-xl text-base font-medium transition" :class="location.pathname.includes('/shop') ? 'bg-purple-500/10 text-purple-400' : 'text-slate-400 hover:bg-slate-900 hover:text-purple-400'"><i class="fa-solid fa-bag-shopping mr-2"></i>商品</a>
      <a href="/admin/tickets.html" class="block px-3 py-2 rounded-xl text-base font-medium transition" :class="location.pathname.includes('/ticket') ? 'bg-purple-500/10 text-purple-400' : 'text-slate-400 hover:bg-slate-900 hover:text-purple-400'"><i class="fa-solid fa-envelope-open-text mr-2"></i>工单</a>
      <a href="/admin/announcements.html" class="block px-3 py-2 rounded-xl text-base font-medium transition" :class="location.pathname.includes('/announcement') ? 'bg-purple-500/10 text-purple-400' : 'text-slate-400 hover:bg-slate-900 hover:text-purple-400'"><i class="fa-solid fa-bullhorn mr-2"></i>公告</a>
      <a href="/admin/coupons.html" class="block px-3 py-2 rounded-xl text-base font-medium transition" :class="location.pathname.includes('/coupon') ? 'bg-purple-500/10 text-purple-400' : 'text-slate-400 hover:bg-slate-900 hover:text-purple-400'"><i class="fa-solid fa-ticket mr-2"></i>优惠券</a>
      <a href="/admin/codes.html" class="block px-3 py-2 rounded-xl text-base font-medium transition" :class="location.pathname.includes('/code') ? 'bg-purple-500/10 text-purple-400' : 'text-slate-400 hover:bg-slate-900 hover:text-purple-400'"><i class="fa-solid fa-barcode mr-2"></i>卡密</a>
      <a href="/admin/invites.html" class="block px-3 py-2 rounded-xl text-base font-medium transition" :class="location.pathname.includes('/invite') ? 'bg-purple-500/10 text-purple-400' : 'text-slate-400 hover:bg-slate-900 hover:text-purple-400'"><i class="fa-solid fa-users mr-2"></i>推广</a>
      <a href="/admin/audits.html" class="block px-3 py-2 rounded-xl text-base font-medium transition" :class="location.pathname.includes('/audit') ? 'bg-purple-500/10 text-purple-400' : 'text-slate-400 hover:bg-slate-900 hover:text-purple-400'"><i class="fa-solid fa-shield-halved mr-2"></i>审计</a>
      <a href="/admin/settings.html" class="block px-3 py-2 rounded-xl text-base font-medium transition" :class="location.pathname.includes('/setting') ? 'bg-purple-500/10 text-purple-400' : 'text-slate-400 hover:bg-slate-900 hover:text-purple-400'"><i class="fa-solid fa-gears mr-2"></i>设置</a>
      <hr class="border-slate-800 my-2">
      <a href="/user/dashboard.html" class="block px-3 py-2 rounded-xl text-base font-medium text-indigo-400 hover:bg-slate-900 transition"><i class="fa-solid fa-circle-arrow-left mr-2"></i>用户中心</a>
      <button @click="logout" class="w-full text-left px-3 py-2 rounded-xl text-base font-medium text-rose-400 hover:bg-rose-950/20 transition"><i class="fa-solid fa-right-from-bracket mr-2"></i>退出登录</button>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 gap-4">
      <div>
        <h2 class="text-2xl font-semibold font-outfit text-white">商品套餐与订单审计</h2>
        <p class="text-slate-400 text-sm mt-1">创建和调度会员购买的订阅套餐，并审计全站已订购的历史套餐明细流水。</p>
      </div>
      <div class="flex space-x-3">
        <button @click="activeTab = 'shops'" class="px-4 py-2 rounded-xl text-sm font-semibold transition" :class="activeTab === 'shops' ? 'bg-purple-600 text-white shadow-lg shadow-purple-600/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'">商品套餐</button>
        <button @click="activeTab = 'bought'" class="px-4 py-2 rounded-xl text-sm font-semibold transition" :class="activeTab === 'bought' ? 'bg-purple-600 text-white shadow-lg shadow-purple-600/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'">购买流水</button>
      </div>
    </div>

    <!-- TAB 1: 商品套餐列表 -->
    <div x-show="activeTab === 'shops'">
      <div class="flex justify-end mb-6">
        <a href="/admin/shop-create.html" class="bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white px-5 py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/25"><i class="fa-solid fa-plus mr-1.5"></i>新建商品套餐</a>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6" x-show="shops.length > 0">
        <template x-for="shop in shops" :key="shop.id">
          <div class="glass-card rounded-2xl p-6 flex flex-col justify-between hover:border-purple-500/30 transition duration-300">
            <div>
              <div class="flex justify-between items-start mb-4">
                <h3 class="text-lg font-bold text-white font-outfit" x-text="shop.name"></h3>
                <span class="text-xs px-2.5 py-0.5 rounded-full font-semibold border" 
                      :class="shop.status === 'on_sale' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20'"
                      x-text="shop.status === 'on_sale' ? '在售' : '下架'"></span>
              </div>
              <div class="text-2xl font-bold text-indigo-400 font-outfit mb-4" x-text="'￥' + shop.price"></div>
              
              <div class="space-y-2 mb-6">
                <div class="flex items-center text-xs text-slate-400">
                  <i class="fa-solid fa-rotate-right mr-2 text-purple-400 w-4"></i>自动续费：<span x-text="shop.auto_renew ? '支持' : '不支持'"></span>
                </div>
                <div class="flex items-center text-xs text-slate-400">
                  <i class="fa-solid fa-clock-rotate-left mr-2 text-purple-400 w-4"></i>重置流量：<span x-text="shop.auto_reset_bandwidth ? '支持次月重置' : '不支持重置'"></span>
                </div>
                <div class="mt-3 text-xs bg-slate-900/50 p-3 rounded-lg border border-slate-800 text-slate-300 whitespace-pre-wrap leading-relaxed custom-scrollbar max-h-24 overflow-y-auto" x-text="shop.content"></div>
              </div>
            </div>

            <div class="flex space-x-2 pt-4 border-t border-slate-800/60">
              <a :href="'/admin/shop-edit.html?id=' + shop.id" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-center text-xs font-semibold py-2 rounded-lg transition flex items-center justify-center"><i class="fa-solid fa-pen mr-1"></i>编辑</a>
              <button @click="deleteShop(shop.id)" class="bg-rose-950/40 hover:bg-rose-950/60 border border-rose-500/20 hover:border-rose-500/40 text-rose-400 text-xs font-semibold px-3 py-2 rounded-lg transition"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        </template>
      </div>

      <div class="glass-card rounded-2xl p-12 text-center" x-show="shops.length === 0">
        <i class="fa-solid fa-boxes-stacked text-4xl text-slate-600 mb-4 block"></i>
        <span class="text-slate-400 text-sm">暂无任何商品套餐，请点击右上方按钮添加。</span>
      </div>
    </div>

    <!-- TAB 2: 购买历史流水 -->
    <div x-show="activeTab === 'bought'" class="glass-card rounded-3xl overflow-hidden">
      <div class="p-6 border-b border-slate-800/80 flex items-center justify-between">
        <h3 class="text-lg font-medium text-white">全站套餐订购明细</h3>
        <span class="text-xs text-slate-400" x-text="'累计成交记录: ' + boughtList.length + ' 笔'"></span>
      </div>

      <div class="overflow-x-auto custom-scrollbar">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="border-b border-slate-800/60 bg-slate-900/35">
              <th class="py-4 px-6 text-slate-400 font-semibold">记录 ID</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">购买用户</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">订购商品</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">实付金额</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">所用优惠券</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">购买时间</th>
              <th class="py-4 px-6 text-slate-400 font-semibold">重置/到期日</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="item in boughtList" :key="item.id">
              <tr class="border-b border-slate-900/40 hover:bg-slate-900/10 transition">
                <td class="py-4 px-6 font-mono text-slate-400" x-text="'#' + item.id"></td>
                <td class="py-4 px-6">
                  <span class="text-white block font-medium" x-text="item.user.userName"></span>
                  <span class="text-xs text-slate-500 font-mono" x-text="item.user.email"></span>
                </td>
                <td class="py-4 px-6">
                  <span class="px-2 py-1 bg-purple-500/10 text-purple-400 border border-purple-500/20 text-xs rounded-lg font-medium" x-text="item.shop.name"></span>
                </td>
                <td class="py-4 px-6 font-mono font-bold text-emerald-400" x-text="'￥' + item.price"></td>
                <td class="py-4 px-6 font-mono text-xs text-slate-400" x-text="item.coupon"></td>
                <td class="py-4 px-6 text-slate-400 text-xs" x-text="item.datetime"></td>
                <td class="py-4 px-6 text-slate-400 text-xs" x-text="item.renew"></td>
              </tr>
            </template>
            <tr x-show="boughtList.length === 0">
              <td colspan="7" class="py-12 text-center text-slate-500">暂无任何订单订购流水明细。</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function adminShopsPage() {
      return {
        activeTab: 'shops',
        shops: [],
        boughtList: [],

        async init() {
          await this.fetchShops();
          await this.fetchBoughtList();
        },

        async fetchShops() {
          try {
            const res = await SPanelAPI.request('/admin/shop');
            this.shops = res.data;
          } catch (err) {
            alert('加载套餐列表失败: ' + err.message);
          }
        },

        async fetchBoughtList() {
          try {
            const res = await SPanelAPI.request('/admin/bought');
            this.boughtList = res.data;
          } catch (err) {
            console.error('加载购买流水失败:', err.message);
          }
        },

        async deleteShop(id) {
          if (!confirm('您确定要永久物理删除该商品套餐吗？此操作不可逆。')) return;
          try {
            await SPanelAPI.request(`/admin/shop/${id}`, { method: 'DELETE' });
            await this.fetchShops();
          } catch (err) {
            alert('删除失败: ' + err.message);
          }
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
