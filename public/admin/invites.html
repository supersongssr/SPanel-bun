<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邀请与推广返利 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="adminInvitesPage()">
  
  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/85 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <a href="/admin/dashboard.html" class="font-outfit text-2xl font-bold bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">SPanel</a>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-purple-500/10 text-purple-400 font-semibold border border-purple-500/20">Admin</span>
        </div>
        <div class="flex items-center space-x-5 text-sm overflow-x-auto py-2 custom-scrollbar">
          <a href="/admin/dashboard.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-chart-pie mr-1.5"></i>监控</a>
          <a href="/admin/users.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-user-gear mr-1.5"></i>会员</a>
          <a href="/admin/nodes.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-server mr-1.5"></i>节点</a>
          <a href="/admin/shops.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-bag-shopping mr-1.5"></i>商品</a>
          <a href="/admin/tickets.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-envelope-open-text mr-1.5"></i>工单</a>
          <a href="/admin/announcements.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-bullhorn mr-1.5"></i>公告</a>
          <a href="/admin/coupons.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-ticket mr-1.5"></i>优惠券</a>
          <a href="/admin/codes.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-barcode mr-1.5"></i>卡密</a>
          <a href="/admin/invites.html" class="text-purple-400 hover:text-purple-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-users mr-1.5"></i>推广</a>
          <a href="/admin/audits.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-shield-halved mr-1.5"></i>审计</a>
          <button @click="logout" class="text-rose-400 hover:text-rose-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-right-from-bracket mr-1.5"></i>退出</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    <div class="mb-8">
      <h2 class="text-2xl font-semibold font-outfit text-white">推广佣金与邀请配额</h2>
      <p class="text-slate-400 text-sm mt-1">管理员可在此批量为指定推广用户加配邀请链接码，并审计下线会员消费所触发的返利佣金日志流水。</p>
    </div>

    <!-- 关键数据卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="glass-card p-6 rounded-2xl">
        <span class="text-slate-500 text-[10px] uppercase font-semibold">历史成交推广返利总笔数</span>
        <span class="block text-white font-semibold font-outfit text-2xl mt-2" x-text="stats.total_records">0</span>
      </div>
      <div class="glass-card p-6 rounded-2xl col-span-2">
        <span class="text-slate-500 text-[10px] uppercase font-semibold">全站累计已拨付推广佣金总额</span>
        <span class="block text-emerald-400 font-semibold font-outfit text-2xl mt-2" x-text="'￥' + stats.total_commission">￥0.00</span>
      </div>
    </div>

    <!-- 双栏布局：左侧加配链接，右侧账目对账单 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- 左侧加配配额栏 -->
      <div class="glass-card p-6 rounded-3xl h-fit">
        <h3 class="text-base font-semibold text-white mb-4 flex items-center"><i class="fa-solid fa-gift text-purple-400 mr-2"></i>增配用户邀请配额</h3>
        <p class="text-xs text-slate-400 leading-relaxed mb-6">公共注册优惠码已逐步废除，您可以人工给指定用户增配可用邀请注册链接数。</p>

        <form @submit.prevent="addInviteQuota" class="space-y-4">
          <div>
            <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-2">目标会员检索 (ID 或邮箱)</label>
            <input type="text" x-model="quotaForm.user_search" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-xs focus:border-purple-500 focus:outline-none transition" placeholder="输入UID，或输入完整邮箱">
          </div>
          <div>
            <label class="block text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-2">欲增加的邀请链接额度数</label>
            <input type="number" x-model.number="quotaForm.num" required min="1" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-xs focus:border-purple-500 focus:outline-none transition" placeholder="例如：5">
          </div>
          <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white py-2.5 rounded-xl text-xs font-semibold transition shadow-lg shadow-purple-600/25">确认追加配额</button>
        </form>
      </div>

      <!-- 右侧对账记录表 -->
      <div class="md:col-span-2 glass-card rounded-3xl overflow-hidden">
        <div class="p-6 border-b border-slate-800/80 flex items-center justify-between">
          <h3 class="text-sm font-semibold text-white">推广交易返利对账流水表</h3>
        </div>

        <div class="overflow-x-auto custom-scrollbar">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="border-b border-slate-800/60 bg-slate-900/35">
                <th class="py-3 px-5 text-slate-400 font-semibold">消费者 (购买人)</th>
                <th class="py-3 px-5 text-slate-400 font-semibold">受益推广人</th>
                <th class="py-3 px-5 text-slate-400 font-semibold">订购消费额</th>
                <th class="py-3 px-5 text-slate-400 font-semibold">应拨佣金</th>
                <th class="py-3 px-5 text-slate-400 font-semibold">入账时间</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="item in paybackList" :key="item.id">
                <tr class="border-b border-slate-900/40 hover:bg-slate-900/10 transition">
                  <td class="py-3.5 px-5">
                    <span class="text-white block font-medium" x-text="item.consumer.userName"></span>
                    <span class="text-[10px] text-slate-500 font-mono" x-text="item.consumer.email"></span>
                  </td>
                  <td class="py-3.5 px-5">
                    <span class="text-indigo-400 block font-medium" x-text="item.promoter.userName"></span>
                    <span class="text-[10px] text-slate-500 font-mono" x-text="item.promoter.email"></span>
                  </td>
                  <td class="py-3.5 px-5 font-mono text-slate-300 font-bold" x-text="'￥' + item.total"></td>
                  <td class="py-3.5 px-5 font-mono text-emerald-400 font-bold" x-text="'￥' + item.ref_get"></td>
                  <td class="py-3.5 px-5 text-slate-400 font-mono" x-text="item.datetime"></td>
                </tr>
              </template>
              <tr x-show="paybackList.length === 0">
                <td colspan="5" class="py-12 text-center text-slate-500">暂无任何推广消费返利对账明细。</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function adminInvitesPage() {
      return {
        stats: {
          total_commission: '0.00',
          total_records: 0
        },
        paybackList: [],
        
        quotaForm: {
          user_search: '',
          num: 5
        },

        async init() {
          await this.fetchInvites();
        },

        async fetchInvites() {
          try {
            const res = await SPanelAPI.request('/admin/invite');
            this.stats = res.data.stats;
            this.paybackList = res.data.list;
          } catch (err) {
            alert('拉取邀请返利流水失败: ' + err.message);
          }
        },

        async addInviteQuota() {
          try {
            const res = await SPanelAPI.request('/admin/invite/add', {
              method: 'POST',
              body: JSON.stringify(this.quotaForm)
            });
            alert(res.message);
            this.quotaForm.user_search = '';
            this.quotaForm.num = 5;
            await this.fetchInvites();
          } catch (err) {
            alert('追加邀请链接配额失败: ' + err.message);
          }
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
