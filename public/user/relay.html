<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中转规则 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="relayPage()">
  
  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <span class="font-outfit text-2xl font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">SPanel</span>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-semibold border border-indigo-500/20">Member</span>
        </div>
        <div class="flex items-center space-x-6 text-sm overflow-x-auto scrollbar-none">
          <a href="/user/dashboard.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-chart-line mr-1.5"></i>控制台</a>
          <a href="/user/nodes.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-server mr-1.5"></i>节点列表</a>
          <a href="/user/relay.html" class="text-indigo-400 hover:text-indigo-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-route mr-1.5"></i>中转规则</a>
          <a href="/user/shop.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-store mr-1.5"></i>套餐商店</a>
          <a href="/user/code.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-credit-card mr-1.5"></i>卡密充值</a>
          <a href="/user/invite.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-gift mr-1.5"></i>推广联盟</a>
          <a href="/user/tickets.html" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-ticket mr-1.5"></i>工单支持</a>
          
          <!-- 用户下拉子菜单 -->
          <div class="relative" x-data="{ open: false }" @click.away="open = false">
            <button @click="open = !open" class="text-slate-400 hover:text-indigo-400 transition font-medium whitespace-nowrap focus:outline-none flex items-center">
              <i class="fa-solid fa-user-gear mr-1.5"></i>我的账户<i class="fa-solid fa-chevron-down text-[10px] ml-1 transition" :class="open ? 'rotate-180' : ''"></i>
            </button>
            <div class="absolute right-0 mt-2 w-40 rounded-xl bg-slate-900 border border-slate-800 shadow-xl py-1 z-50" x-show="open" x-transition>
              <a href="/user/profile.html" class="block px-4 py-2 text-xs text-slate-300 hover:bg-slate-800 transition"><i class="fa-solid fa-user mr-2"></i>个人中心</a>
              <a href="/user/edit.html" class="block px-4 py-2 text-xs text-slate-300 hover:bg-slate-800 transition"><i class="fa-solid fa-shield-halved mr-2"></i>安全设置</a>
              <hr class="border-slate-800 my-1">
              <button @click="logout" class="w-full text-left px-4 py-2 text-xs text-rose-400 hover:bg-rose-950/20 transition"><i class="fa-solid fa-right-from-bracket mr-2"></i>退出登录</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    
    <div class="mb-8 flex justify-between items-center">
      <div>
        <h2 class="text-2xl font-semibold font-outfit text-white">中转转发规则</h2>
        <p class="text-slate-400 text-sm mt-2">中转服务用于将国内加速入口的流量中转至国外落地节点，有助于降低延迟并提升极端网络环境下的连接稳定性。</p>
      </div>
      <button @click="openCreateDrawer" class="bg-gradient-to-r from-indigo-500 to-pink-500 hover:brightness-110 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition active:scale-[0.98]">
        <i class="fa-solid fa-plus mr-1.5"></i>添加中转规则
      </button>
    </div>

    <!-- 中转规则列表 -->
    <div class="glass-card p-6 rounded-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-300">
          <thead>
            <tr class="border-b border-slate-800 text-slate-500 font-semibold">
              <th class="py-3">入口中转节点 (Source)</th>
              <th class="py-3">出口落地节点 (Dist)</th>
              <th class="py-3">监听端口</th>
              <th class="py-3">规则优先级</th>
              <th class="py-3 text-right">操作</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800/40">
            <template x-for="rule in rules" :key="rule.id">
              <tr>
                <td class="py-4">
                  <div class="flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
                    <span class="font-medium text-slate-200" x-text="rule.source_node_name"></span>
                  </div>
                </td>
                <td class="py-4">
                  <div class="flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-pink-500"></span>
                    <span class="text-slate-300" x-text="rule.dist_node_name"></span>
                  </div>
                </td>
                <td class="py-4 font-mono font-bold text-indigo-400" x-text="rule.port"></td>
                <td class="py-4" x-text="rule.priority || 0"></td>
                <td class="py-4 text-right space-x-2">
                  <button @click="openEditDrawer(rule)" class="bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 border border-indigo-500/10 px-2.5 py-1.5 rounded-lg transition text-[10px] font-semibold"><i class="fa-solid fa-pen-to-square mr-1"></i>编辑</button>
                  <button @click="deleteRule(rule.id)" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/10 px-2.5 py-1.5 rounded-lg transition text-[10px] font-semibold"><i class="fa-solid fa-trash-can mr-1"></i>删除</button>
                </td>
              </tr>
            </template>
            <template x-if="rules.length === 0">
              <tr>
                <td colspan="5" class="py-12 text-center text-slate-650 text-xs">
                  <i class="fa-solid fa-route text-3xl text-slate-850 mb-3 block"></i>
                  当前没有任何中转规则。如果没有设置规则，您的订阅节点将以普通直连模式运行。
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 抽屉层：新增 / 编辑中转规则 -->
    <div class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-end z-50" x-show="showDrawer" x-transition>
      <div class="bg-slate-900 border-l border-slate-800 h-full max-w-md w-full p-8 overflow-y-auto flex flex-col justify-between" @click.away="closeDrawer">
        <div>
          <div class="flex items-center justify-between mb-8">
            <h3 class="text-xl font-semibold text-white flex items-center font-outfit">
              <i class="fa-solid fa-route text-indigo-400 mr-2"></i>
              <span x-text="isEdit ? '编辑中转规则' : '新增中转规则'"></span>
            </h3>
            <button @click="closeDrawer" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-lg"></i></button>
          </div>

          <div class="space-y-5">
            <div>
              <label class="block text-slate-300 text-xs font-semibold mb-2">入口中转节点 (流量汇入起点)</label>
              <select x-model="formData.source_node_id" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                <option value="">-- 请选择国内入口中转加速服务器 --</option>
                <template x-for="node in nodes" :key="node.id">
                  <option :value="node.id" x-text="node.name"></option>
                </template>
              </select>
            </div>

            <div>
              <label class="block text-slate-300 text-xs font-semibold mb-2">出口落地节点 (流量汇出落点)</label>
              <select x-model="formData.dist_node_id" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                <option value="0">直接出口直连 (落地目标 IP)</option>
                <template x-for="node in nodes" :key="node.id">
                  <option :value="node.id" x-text="node.name" :disabled="node.id == formData.source_node_id"></option>
                </template>
              </select>
            </div>

            <div x-show="formData.dist_node_id == 0">
              <label class="block text-slate-300 text-xs font-semibold mb-2">直接出口目标 IP / 域名 (dist_ip)</label>
              <input type="text" x-model="formData.dist_ip" placeholder="例如: 8.8.8.8 或出口落地主机域名" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div>
              <label class="block text-slate-300 text-xs font-semibold mb-2">我的个人连接端口 (监听端口)</label>
              <input type="number" x-model="formData.port" readonly class="w-full bg-slate-950/60 border border-slate-800/80 rounded-xl px-4 py-3 text-xs text-slate-400 cursor-not-allowed font-mono">
              <p class="text-[10px] text-slate-500 mt-1">系统会自动锁定配置为您的个人 Shadowsocks 监听端口，确保链路中转流量对齐您个人账单。</p>
            </div>

            <div>
              <label class="block text-slate-300 text-xs font-semibold mb-2">规则优先级 (数字越大，多条规则匹配时越优先运行)</label>
              <input type="number" x-model="formData.priority" placeholder="默认为 0" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 transition">
            </div>
          </div>
        </div>

        <div class="mt-8 flex space-x-3">
          <button @click="closeDrawer" class="flex-1 bg-slate-950 border border-slate-800 hover:border-rose-500/30 text-slate-400 rounded-xl py-3 text-xs font-semibold transition">
            取消
          </button>
          <button @click="saveRule" :disabled="saveLoading" class="flex-1 bg-gradient-to-r from-indigo-500 to-pink-500 text-white rounded-xl py-3 text-xs font-semibold hover:brightness-110 transition active:scale-[0.98]">
            <span x-show="!saveLoading">确认保存规则</span>
            <span x-show="saveLoading"><i class="fa-solid fa-spinner animate-spin"></i> 正在应用配置...</span>
          </button>
        </div>
      </div>
    </div>

  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function relayPage() {
      return {
        rules: [],
        nodes: [],
        profilePort: null,
        
        showDrawer: false,
        isEdit: false,
        saveLoading: false,
        editingId: null,

        formData: {
          source_node_id: '',
          dist_node_id: '0',
          dist_ip: '',
          port: '',
          priority: 0
        },

        async init() {
          await this.fetchUserPort();
          await this.fetchRules();
          await this.fetchNodes();
        },

        async fetchUserPort() {
          try {
            const res = await SPanelAPI.request('/user/profile');
            this.profilePort = res.data.port;
            this.formData.port = this.profilePort;
          } catch(err) {
            console.error('获取个人端口失败：' + err.message);
          }
        },

        async fetchRules() {
          try {
            const res = await SPanelAPI.request('/user/relay');
            this.rules = res.data || [];
          } catch(err) {
            console.error('拉取中转规则出错：' + err.message);
          }
        },

        async fetchNodes() {
          try {
            const res = await SPanelAPI.request('/user/node');
            this.nodes = res.data || [];
          } catch(err) {
            console.error('拉取节点列表出错：' + err.message);
          }
        },

        openCreateDrawer() {
          this.isEdit = false;
          this.editingId = null;
          this.formData = {
            source_node_id: '',
            dist_node_id: '0',
            dist_ip: '',
            port: this.profilePort,
            priority: 0
          };
          this.showDrawer = true;
        },

        openEditDrawer(rule) {
          this.isEdit = true;
          this.editingId = rule.id;
          this.formData = {
            source_node_id: rule.source_node_id.toString(),
            dist_node_id: rule.dist_node_id.toString(),
            dist_ip: rule.dist_ip || '',
            port: rule.port,
            priority: rule.priority
          };
          this.showDrawer = true;
        },

        closeDrawer() {
          this.showDrawer = false;
        },

        async saveRule() {
          if (!this.formData.source_node_id) {
            alert('请选择中转入口节点！');
            return;
          }
          if (this.formData.dist_node_id == 0 && !this.formData.dist_ip.trim()) {
            alert('当出口直连时，必须配置具体的 dist_ip 目标 IP 属性！');
            return;
          }

          this.saveLoading = true;
          const payload = {
            source_node_id: Number(this.formData.source_node_id),
            dist_node_id: Number(this.formData.dist_node_id),
            dist_ip: this.formData.dist_node_id == 0 ? this.formData.dist_ip.trim() : '',
            port: Number(this.formData.port),
            priority: Number(this.formData.priority || 0)
          };

          try {
            if (this.isEdit) {
              const res = await SPanelAPI.request(`/user/relay/${this.editingId}`, {
                method: 'PUT',
                body: JSON.stringify(payload)
              });
              alert(res.message || '中转规则已安全更新！');
            } else {
              const res = await SPanelAPI.request('/user/relay', {
                method: 'POST',
                body: JSON.stringify(payload)
              });
              alert(res.message || '中转规则已成功部署！');
            }
            this.closeDrawer();
            await this.fetchRules();
          } catch(err) {
            alert(err.message || '应用中转规则失败，请稍后检查参数或联系管理员。');
          } finally {
            this.saveLoading = false;
          }
        },

        async deleteRule(id) {
          if (!confirm('您确定要移除该条中转转发配置吗？对应链路的加速中转将立即断开。')) return;
          try {
            const res = await SPanelAPI.request(`/user/relay/${id}`, {
              method: 'DELETE'
            });
            alert(res.message || '规则已成功卸载。');
            await this.fetchRules();
          } catch(err) {
            alert(err.message || '移除失败。');
          }
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
