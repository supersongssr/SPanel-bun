<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>节点调度 - SPanel</title>
  <script src="/assets/js/auth-guard.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="min-h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black text-slate-100 pb-12" x-data="adminNodesPage()">
  
  <!-- 顶部导航栏 -->
  <nav class="border-b border-slate-800 bg-slate-950/85 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <span class="font-outfit text-2xl font-bold bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">SPanel</span>
          <span class="text-xs px-2.5 py-0.5 rounded-full bg-purple-500/10 text-purple-400 font-semibold border border-purple-500/20">Admin</span>
        </div>
        <div class="flex items-center space-x-5 text-sm overflow-x-auto py-2 custom-scrollbar">
          <a href="/admin/dashboard.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-chart-pie mr-1.5"></i>监控</a>
          <a href="/admin/users.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-user-gear mr-1.5"></i>会员</a>
          <a href="/admin/nodes.html" class="text-purple-400 hover:text-purple-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-server mr-1.5"></i>节点</a>
          <a href="/admin/shops.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-bag-shopping mr-1.5"></i>商品</a>
          <a href="/admin/tickets.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-envelope-open-text mr-1.5"></i>工单</a>
          <a href="/admin/announcements.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-bullhorn mr-1.5"></i>公告</a>
          <a href="/admin/coupons.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-ticket mr-1.5"></i>优惠券</a>
          <a href="/admin/codes.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-barcode mr-1.5"></i>卡密</a>
          <a href="/admin/invites.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-users mr-1.5"></i>推广</a>
          <a href="/admin/audits.html" class="text-slate-400 hover:text-purple-400 transition font-medium whitespace-nowrap"><i class="fa-solid fa-shield-halved mr-1.5"></i>审计</a>
          <button @click="logout" class="text-rose-400 hover:text-rose-300 transition font-medium whitespace-nowrap"><i class="fa-solid fa-right-from-bracket mr-1.5"></i>退出</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主体内容 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
    
    <div class="flex items-center justify-between mb-8 border-b border-slate-800 pb-6">
      <div>
        <h2 class="text-2xl font-semibold font-outfit text-white">全球加速代理物理节点调度管理</h2>
        <p class="text-slate-400 text-sm mt-2">在这里，您可以快速增删改物理代理服务器，定义各节点的扣费费率、用户等级门槛、国家标识和单用户连接数上限。</p>
      </div>
      <button @click="openCreateModal" class="bg-purple-500 hover:bg-purple-600 text-white px-5 py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-purple-500/20 transition flex items-center">
        <i class="fa-solid fa-plus mr-2"></i>上架新节点
      </button>
    </div>

    <!-- 节点数据列表卡片 -->
    <div class="glass-card rounded-2xl overflow-hidden border border-slate-800/80">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-900 text-slate-400 border-b border-slate-800 font-semibold uppercase tracking-wider text-[10px]">
              <th class="p-4">ID</th>
              <th class="p-4">节点名称</th>
              <th class="p-4">加速服务器地址</th>
              <th class="p-4">加密方式</th>
              <th class="p-4">费率比例</th>
              <th class="p-4">等级门槛</th>
              <th class="p-4">分组</th>
              <th class="p-4">显示状态</th>
              <th class="p-4 text-center">调度管理操作</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800/50">
            <template x-for="node in nodes" :key="node.id">
              <tr class="hover:bg-slate-900/30 transition">
                <td class="p-4 font-outfit text-slate-500" x-text="node.id"></td>
                <td class="p-4 font-medium text-slate-200">
                  <span class="text-xs px-2 py-0.5 rounded-full font-semibold font-outfit uppercase border border-purple-500/20 bg-purple-500/5 text-purple-400 mr-2" x-text="node.country_code"></span>
                  <span x-text="node.name"></span>
                </td>
                <td class="p-4 text-slate-400 font-mono" x-text="node.server"></td>
                <td class="p-4 text-indigo-400 font-mono" x-text="node.method"></td>
                <td class="p-4 font-outfit text-emerald-400" x-text="node.traffic_rate + 'x'"></td>
                <td class="p-4">
                  <span class="px-2 py-0.5 rounded bg-slate-900 border border-slate-800 text-slate-400 font-semibold font-outfit" x-text="'VIP ' + node.node_class"></span>
                </td>
                <td class="p-4 font-outfit text-slate-400" x-text="'G ' + node.node_group"></td>
                <td class="p-4">
                  <span class="inline-flex items-center text-[10px]" :class="node.type ? 'text-emerald-400' : 'text-slate-500'">
                    <i class="fa-solid fa-circle text-[6px] mr-1.5 animate-pulse"></i>
                    <span x-text="node.type ? '在售显示' : '隐藏下架'"></span>
                  </span>
                </td>
                <td class="p-4 flex items-center justify-center space-x-2">
                  <button @click="openEditModal(node)" class="bg-slate-900 border border-slate-800 hover:border-purple-500/50 text-slate-300 p-2 rounded-xl text-xs transition" title="编辑物理节点">
                    <i class="fa-regular fa-pen-to-square"></i>
                  </button>
                  <button @click="deleteNode(node.id)" class="bg-slate-950 border border-slate-800 hover:border-rose-500/30 text-rose-400 p-2 rounded-xl text-xs transition" title="下架并删除节点">
                    <i class="fa-regular fa-trash-can"></i>
                  </button>
                </td>
              </tr>
            </template>
            <template x-if="nodes.length === 0">
              <tr>
                <td colspan="9" class="text-center py-8 text-slate-500 text-xs">没有找到任何物理代理节点记录。</td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 节点物理属性配置模态弹窗 -->
    <div class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-50 overflow-y-auto" x-show="showModal" x-transition>
      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-xl w-full mx-4 my-8 relative overflow-hidden" @click.away="closeModal">
        <h3 class="text-xl font-semibold text-white mb-6 flex items-center">
          <i class="fa-solid fa-server text-purple-400 mr-2"></i>
          <span x-text="isEditMode ? '修改加速物理节点属性' : '上架全新全球代理节点'"></span>
        </h3>

        <form @submit.prevent="saveNodeChanges" class="space-y-4 max-h-[450px] overflow-y-auto pr-2">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-400 text-xs mb-2">节点名称</label>
              <input type="text" required x-model="formNode.name" placeholder="例如: 香港 BGP 高速五期" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
            <div>
              <label class="block text-slate-400 text-xs mb-2">国家/地区缩写 (Country Code)</label>
              <input type="text" required x-model="formNode.country_code" placeholder="例如: HK, US, JP" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
          </div>

          <div class="grid grid-cols-1">
            <div>
              <label class="block text-slate-400 text-xs mb-2">加速服务器连接地址 (IP/域名)</label>
              <input type="text" required x-model="formNode.server" placeholder="hk.node.yourdomain.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-400 text-xs mb-2">核心加密协议类型 (Cipher)</label>
              <input type="text" required x-model="formNode.method" placeholder="aes-256-gcm" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
            <div>
              <label class="block text-slate-400 text-xs mb-2">节点状态简评</label>
              <input type="text" required x-model="formNode.status" placeholder="例如: 香港优质BGP混合带宽，流畅在线" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-400 text-xs mb-2">物理描述信息</label>
              <input type="text" required x-model="formNode.info" placeholder="VIP 3 大容量线路" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
            <div>
              <label class="block text-slate-400 text-xs mb-2">扣费流量费率乘数</label>
              <input type="text" required x-model="formNode.traffic_rate" placeholder="例如: 1.00 或 0.50 (免流)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-400 text-xs mb-2">最低访问等级门槛 (VIP Class)</label>
              <input type="number" required x-model.number="formNode.node_class" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
            <div>
              <label class="block text-slate-400 text-xs mb-2">隔离调度分配分组 (Group ID)</label>
              <input type="number" required x-model.number="formNode.node_group" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
          </div>

          <div class="grid grid-cols-3 gap-4">
            <div>
              <label class="block text-slate-400 text-xs mb-2">单物理限速 (Mbps)</label>
              <input type="text" required x-model="formNode.node_speedlimit" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
            <div>
              <label class="block text-slate-400 text-xs mb-2">连接限制数</label>
              <input type="number" required x-model.number="formNode.node_connector" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
            <div>
              <label class="block text-slate-400 text-xs mb-2">最大带宽负载(M)</label>
              <input type="text" required x-model="formNode.node_bandwidth" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-slate-400 text-xs mb-2">总结算限制流量 (字节 Bytes)</label>
              <input type="text" required x-model="formNode.traffic_limit" placeholder="1099511627776 (1TB)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-purple-500 transition">
            </div>
            <div class="flex items-center space-x-6 pt-6 pl-4">
              <label class="flex items-center space-x-2 text-xs cursor-pointer text-slate-300">
                <input type="checkbox" x-model="formNode.type" class="bg-slate-950 border-slate-800 text-purple-500 rounded focus:ring-purple-500">
                <span>正常在售显示</span>
              </label>
            </div>
          </div>

          <div class="mt-8 flex space-x-3 pt-4 border-t border-slate-800">
            <button type="button" @click="closeModal" class="flex-1 bg-slate-950 border border-slate-800 hover:border-rose-500/30 text-slate-400 rounded-xl py-3 text-xs transition">
              关闭放弃
            </button>
            <button type="submit" :disabled="formLoading" class="flex-1 bg-gradient-to-r from-purple-500 via-indigo-500 to-pink-500 text-white rounded-xl py-3 text-xs font-semibold hover:brightness-110 transition disabled:opacity-50">
              <span x-show="!formLoading">保存节点记录</span>
              <span x-show="formLoading"><i class="fa-solid fa-spinner animate-spin mr-1"></i>保存中...</span>
            </button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <script src="/assets/js/api.js"></script>
  <script>
    function adminNodesPage() {
      return {
        nodes: [],
        showModal: false,
        isEditMode: false,
        formNode: {},
        formLoading: false,

        async init() {
          await this.fetchNodes();
        },

        async fetchNodes() {
          try {
            const res = await SPanelAPI.request('/admin/node');
            this.nodes = res.data || [];
          } catch (err) {
            console.error('加载节点调度列表失败:', err.message);
          }
        },

        openCreateModal() {
          this.isEditMode = false;
          this.formNode = {
            name: '',
            country_code: '',
            server: '',
            method: 'aes-256-gcm',
            status: '正常加速运行',
            info: '高速低延迟BGP中继专线',
            traffic_rate: '1.00',
            node_class: 0,
            node_group: 0,
            node_speedlimit: '0.00',
            node_connector: 0,
            node_bandwidth: '0.00',
            traffic_limit: '1099511627776', // 默认 1TB bytes
            type: true
          };
          this.showModal = true;
        },

        openEditModal(node) {
          this.isEditMode = true;
          this.formNode = {
            ...node
          };
          this.showModal = true;
        },

        closeModal() {
          this.showModal = false;
          this.formNode = {};
        },

        async saveNodeChanges() {
          this.formLoading = true;
          const method = this.isEditMode ? 'PUT' : 'POST';
          const endpoint = this.isEditMode ? `/admin/node/${this.formNode.id}` : '/admin/node';

          try {
            await SPanelAPI.request(endpoint, {
              method: method,
              body: JSON.stringify({
                name: this.formNode.name,
                server: this.formNode.server,
                method: this.formNode.method,
                info: this.formNode.info,
                status: this.formNode.status,
                type: this.formNode.type,
                traffic_rate: this.formNode.traffic_rate,
                node_group: this.formNode.node_group,
                node_class: this.formNode.node_class,
                node_speedlimit: this.formNode.node_speedlimit,
                node_connector: this.formNode.node_connector,
                node_bandwidth: this.formNode.node_bandwidth,
                traffic_limit: this.formNode.traffic_limit,
                country_code: this.formNode.country_code
              })
            });

            alert(this.isEditMode ? '物理节点配置更新成功！' : '新代理节点已成功上架部署！');
            this.closeModal();
            await this.fetchNodes();
          } catch (err) {
            alert(err.message || '保存节点属性失败，请检查输入格式。');
          } finally {
            this.formLoading = false;
          }
        },

        async deleteNode(nodeId) {
          const confirmOk = confirm('调度警告：您确定要下架并物理删除该加速节点吗？这会断开目前正连接在该节点上的所有客户端会话！');
          if (!confirmOk) return;

          try {
            await SPanelAPI.request(`/admin/node/${nodeId}`, { method: 'DELETE' });
            alert('物理节点已成功下架清退。');
            await this.fetchNodes();
          } catch (err) {
            alert('删除节点失败: ' + err.message);
          }
        },

        logout() {
          localStorage.removeItem('spanel_jwt');
          localStorage.removeItem('spanel_user');
          window.location.replace('/auth/login.html');
        }
      }
    }
  </script>
</body>
</html>
